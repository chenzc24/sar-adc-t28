schema_version: 1
nodes:
  sampling/sample_root:
    reasons: [精度决定误差容限，采样时间决定建立窗口。, 获取与保持是两道关口：跟得上输入不代表断开后电荷正确。]
    figures: [sampling_rc]
  sampling/ideal:
    reasons: [理想栅驱动隔离主 MOS 的导通能力，便于比较尺寸和器件族。, PVT 的 Ron 结果不包含真实驱动的下垂、馈通和关断注入。]
    figures: [main_ron]
  sampling/driver:
    reasons: [获取误差很小而保持误差超标，当前矛盾不在单纯降低 Ron。, 无电压模型告警只是诊断筛查，不等于 foundry 可靠性签核。]
  sampling/input_path:
    reasons: [去加载后仍失败，持续输入电流不是全部原因。, 延迟复位将复位贡献降至约 +0.080 mV，主要误差在此前已形成。, 慢边沿与加倍负载也未通过，需检查实际 CDAC 的节点切换。]
  sampling/full_cdac:
    reasons: [底板接 VCM 后，原本相对 VIN 关断的 MN11 可能重新导通。, 理想 VSS 关断消除该通路，理想钳位五输入最大误差为 0.004218 mV。, 真实钳位仍失败；隔离、钳位和端子应力必须分别收敛。]
  sampling/next_topology:
    reasons: [关断条件必须覆盖底板切换后的电位，不能只检查栅对 VIN 电压。, 真实驱动应兼顾隔离、端子应力与下一周期获取。]
    figures: [gmain_comparison]
  sampling/clamp:
    reasons: [消除 MN11 持续导通后，比较器端仍有较大残差。, 钳位要能充分复位，同时减少释放注入、寄生耦合与应力。]
  sampling/verify:
    reasons: [两条分支必须在同一完整 CDAC 中联合通过。, 单点静态通过后，再扩展动态与工艺覆盖。]
  cdac/requirement:
    reasons: [采样开关与 CDAC 共享同一采样噪声预算，不能重复计入。, 电容增大有利于噪声，但对参考驱动和建立速度不利。]
  cdac/constraint:
    reasons: [两侧独立噪声叠加决定每侧等效采样电容下限，不是单位 Cu。, 原始保持误差另行约束；不能从 kT/C 通过推断关断通过。]
  cdac/result:
    reasons: [理想钳位结果说明底板隔离机制有效，不代表真实采样链已通过。, 换真实钳位后单点仍失败，需要独立分析释放扰动。, 下方相位图为旧 W185 夹具，仅供历史对照。]
    figures: [bottom_phase]
  cdac/next:
    reasons: [先拆分钳位复位能力、释放注入与节点耦合。, 再与真实主栅门控汇合，检查完整采样链与下一周期获取。]
  reference/requirement:
    reasons: [参考与开关共享噪声预算，不能各自用满后再相加。, 噪声与确定性建立残差是不同验收项。]
  reference/constraint:
    reasons: [逐 bit 参考切换必须在比较器判决前完成建立。, 单极点 RC 给出条件可行域，真实 buffer 的阻抗会随频率与负载变化。]
    figures: [reference_rc]
  reference/result:
    reasons: [现有结果属于约束模型，不是完整参考缓冲器实现。, 需要实际输出电流和瞬态恢复证据才能确认驱动能力。]
  reference/next:
    reasons: [按 CDAC 切换负载设计缓冲器，再检查建立与稳定性。, 在速度、输出噪声和功耗之间重新平衡初始预算。]
  comparator/requirement:
    reasons: [输入等效噪声与系统失调分开分配，不能用同一结果覆盖。, 正确判断非零输入只验证极性，不证明小输入错误概率满足要求。]
  comparator/constraint:
    reasons: [再生时间由有效 gm 与节点电容共同决定，不是普通静态 AC 增益。, 失调与决策时间是独立分配，不能由噪声预算唯一推出。]
    figures: [comparator_gm]
  comparator/result:
    reasons: [六次无噪声 TT 接口实验中非零输入极性正确，速度已有参考。, 噪声与局部失配筛查仍未达分配，模块并未通过。, 动态回踢是时钟触发的扰动，不能直接当成静态 offset。]
  comparator/next:
    reasons: [优化噪声和失调时，必须同步检查速度与输入回踢。, 扩展 PVT、噪声与失配覆盖，再进入全转换联合验收。]
  clock/requirement:
    reasons: [相同 jitter 在更高输入频率下造成更大的电压误差。, 20 ps 是初始时间预算，不是物理时钟链实测。]
    figures: [clock_jitter]
  clock/constraint:
    reasons: [采样、参考建立和比较器判决共同消耗周期时间。, 非重叠可避免通路重叠，但过长也可能恶化 Bootstrap 关断误差。]
  clock/result:
    reasons: [已有理想相位控制参考，尚未验证完整物理时钟链。, 实际边沿、负载与抖动不能由理想数字控制结果推断。]
  clock/next:
    reasons: [结合真实开关负载落实非重叠和边沿时序。, 再联合检查 jitter、速度和功耗，避免局部优化挤占总时间预算。]
