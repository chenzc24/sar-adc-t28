  - {id: pump, title: 辅助升压 / 预充电, devices: [XCP1, XCP2, XMN1, XMN2, XMN3], text: 时钟耦合与交叉连接为 BTOP 预充电提供条件；最终电压取决于时钟历史。}
  - {id: store, title: 自举储能, devices: [XCBOOT], text: 保存 BTOP 与 BBOT 的电压差；理想电荷保持不等于真实寄生下的保持。}
  - {id: sample, title: 输入跟随 / 主采样, devices: [XMN9, XMN11], text: MN9 接 VIN 与 BBOT；MN11 接 VIN 与 VOUT，两管共用 GBOOT。}
