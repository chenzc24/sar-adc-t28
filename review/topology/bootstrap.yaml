phases:
  - id: precharge
    title: 预充电
    clock: PHI=L，PHIB=H（约定）
    devices: [XCP1, XCP2, XMN1, XMN2, XMN3, XMP4, XMN7, XMN10, XMN12]
    text: 预期 MN12 拉低 BBOT，MP4 拉高 CTRL、关闭 MP8；MN7/MN10 释放栅电荷，MN3 为 BTOP 预充电。
    verify: 核对 CBOOT 初始压差与 GBOOT 复位。
  - id: track
    title: 采样跟踪
    clock: PHI=H，PHIB=L（约定）
    devices: [XCBOOT, XMN5, XMN13, XMP8, XMN9, XMN11]
    text: 预充电充分、传输支路导通时，MN9 使 BBOT 跟随 VIN，MP8 接通 BTOP/GBOOT，MN11 将 VIN 传到 VOUT。
    verify: 检查 V(GBOOT)−V(VIN) 的保持与启动过程。
  - id: turnoff
    title: 关断过渡
    clock: PHI/PHIB 边沿与非重叠时间未定义
    devices: [XCBOOT, XMP8, XMN7, XMN10, XMN12, XMN9, XMN11]
    text: 比较主栅下降、MN11 隔离与 BBOT 复位的先后，定位可能的电荷扰动。
    verify: 同时观察 GBOOT、BBOT、VOUT、电容电荷与主开关电流，改变复位时刻做对照。
  - id: hold
    title: 保持 / 复位
    clock: PHI=L，PHIB=H；与预充电电平相同，历史不同
    devices: [XMN11, XMN9, XMN7, XMN10, XMN12]
    text: 预期主开关关断，内部恢复预充电；VOUT 由外部 CDAC/电容保持，本子电路未包含该负载。
    verify: 接入保持负载后，检查 VIN 变化对 VOUT 的影响。
topics:
  - id: bootstrap
    title: 自举为何有效
    phase: track
    devices: [XCBOOT, XMP8, XMN9, XMN11]
    nets: [BTOP, BBOT, net0, VIN]
    fact: CBOOT 跨接 BTOP/BBOT；MN9 接 VIN/BBOT；MP8 接 BTOP/net0；MN11 栅接 net0。
    inference: 若 CBOOT 压差近似保持且传输支路有效，则 GBOOT≈VIN+VCBOOT，主开关 VGS≈VCBOOT。
    verify: 扫描 VIN，观察 CBOOT 压差与主开关 VGS。
  - id: shared
    title: 共享栅控制的约束
    phase: turnoff
    devices: [XMN9, XMN11, XMN13]
    nets: [net0]
    fact: MN9.G、MN11.G、MN13.G 均接 net0；MN9.B 与 MN11.B 接 VIN。
    inference: 同栅、不同源极电位，开关时刻不一定相同；独立调节关断顺序受限。
    verify: 对照三管端子电压与电流，判断是否需要分开控制。
  - id: reset
    title: 复位如何影响保持电荷
    phase: turnoff
    devices: [XCBOOT, XMP8, XMN7, XMN10, XMN12, XMN11]
    nets: [BBOT, BTOP, net0]
    fact: MN12 接 BBOT/VSS；CBOOT 连接 BBOT/BTOP；MP8 连接 BTOP/net0，net0 又控制 MN11。
    inference: 若复位时自举支路或主开关尚未隔离，内部变化可能经导通或寄生耦合影响 VOUT。
    verify: 固定负载、扫描关断与复位间隔，对照主栅、VOUT 与负载电荷。
