phases:
  - id: precharge
    title: 预充电
    clock: PHI=L，PHIB=H（约定）
    devices: [XCP1, XCP2, XMN1, XMN2, XMN3, XMP4, XMN7, XMN10, XMN12]
    text: 预期 MN12 拉低 BBOT，MP4 拉高 CTRL 使 MP8 倾向关闭；GBOOT 经 MN7/MN10 放电，辅助网络经 MN3 为 BTOP 预充电。高亮是关注器件，不是自动判定导通。
    verify: 核对 CBOOT 初始压差和 GBOOT 复位，不能从静态图认定 CBOOT 充到 VDD。
  - id: track
    title: 采样跟踪
    clock: PHI=H，PHIB=L（约定）
    devices: [XCBOOT, XMN5, XMN13, XMP8, XMN9, XMN11]
    text: 在预充电充分且相关器件能导通的条件下，MN9 使 BBOT 跟随 VIN，MN5/MN13 控制 CTRL，MP8 将 BTOP 接到 GBOOT，MN11 传递 VIN 至 VOUT。
    verify: 检查 V(GBOOT)−V(VIN) 是否保持；启动过程和驱动能力仍待验证。
  - id: turnoff
    title: 关断过渡
    clock: PHI/PHIB 边沿与非重叠时间未定义
    devices: [XCBOOT, XMP8, XMN7, XMN10, XMN12, XMN9, XMN11]
    text: 需要比较主栅下降、MN11 隔离和 BBOT 复位的先后；可能的耦合属于待验证机制，不能从图推得误差符号或幅度。
    verify: 同时观察 GBOOT、BBOT、VOUT、电容电荷与主开关电流，改变复位时刻做对照。
  - id: hold
    title: 保持 / 复位
    clock: PHI=L，PHIB=H；与预充电电平相同，历史不同
    devices: [XMN11, XMN9, XMN7, XMN10, XMN12]
    text: 预期主开关关断，内部恢复预充电；VOUT 是否保持由外部 CDAC/电容及泄漏决定，本子电路没有该负载。
    verify: 添加明确的外部保持负载后，检查 VIN 变化是否影响 VOUT；体端连接必须保留。
topics:
  - id: bootstrap
    title: 自举为何有效
    phase: track
    devices: [XCBOOT, XMP8, XMN9, XMN11]
    nets: [BTOP, BBOT, net0, VIN]
    fact: CBOOT 跨接 BTOP/BBOT；MN9 接 VIN/BBOT；MP8 接 BTOP/net0；MN11 栅接 net0。
    inference: 若 CBOOT 压差近似保持且传输支路有效，则 GBOOT≈VIN+VCBOOT，主开关 VGS≈VCBOOT。
    verify: 观察 CBOOT 压差及主开关 VGS 随 VIN 的变化；真实下垂、寄生和阈值效应未计入。
  - id: shared
    title: 共享栅控制的约束
    phase: turnoff
    devices: [XMN9, XMN11, XMN13]
    nets: [net0]
    fact: MN9.G、MN11.G、MN13.G 均接 net0；MN9.B 与 MN11.B 接 VIN。
    inference: 三管共享栅波形，但源极电位不同，不能推断同时导通或同时关断；独立调节关断顺序受限。
    verify: 对照三管端子电压与电流，检验分别控制的必要性；本例不宣称某条体电流已经发生。
  - id: reset
    title: 复位如何影响保持电荷
    phase: turnoff
    devices: [XCBOOT, XMP8, XMN7, XMN10, XMN12, XMN11]
    nets: [BBOT, BTOP, net0]
    fact: MN12 接 BBOT/VSS；CBOOT 连接 BBOT/BTOP；MP8 连接 BTOP/net0，net0 又控制 MN11。
    inference: 若底板复位时自举传输或主开关尚未隔离，内部变化可能经导通或寄生耦合影响 VOUT；不是已确认的误差归因。
    verify: 固定外部负载，改变关断与复位间隔，观察主栅、VOUT 与负载电荷；拓扑本身不能给出数值结论。
