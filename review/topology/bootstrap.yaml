  - {id: store, title: 自举储能, devices: [XCBOOT], text: 保存 BTOP 与 BBOT 的电压差。}
  - {id: sample, title: 输入跟随 / 主采样, devices: [XMN9, XMN11], text: MN9 接 VIN 与 BBOT；MN11 接 VIN 与 VOUT，两管共用 GBOOT。}
