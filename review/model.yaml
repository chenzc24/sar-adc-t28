schema_version: 1
title: SAR ADC · 设计审查台
baseline: 架构预算 v1 · 暂定分配
reviewed_at: '2026-09-30'
focus: topology
sources:
  spec: config/design_spec.yaml
  budget: docs/error_budget.md
  first_order: docs/module_first_order_models.md
  main_switch: docs/bootstrap_main_switch_screening.md
  protected: docs/bootstrap_protected_eval.md
  audit: docs/bootstrap_current_path_audit.md
  full18_config: config/bootstrap_protected_full18_eval.yaml
  bottom_plate: docs/bootstrap_bottom_plate_clamp_width_screen.md
  comparator: docs/strongarm_cdac_integration.md
  macro: docs/electrical_macro_model.md
  fast_ab: docs/bootstrap_netlist_fast_ab.md
  isolate_reset: docs/bootstrap_isolate_before_reset.md
  turnoff_charge: docs/bootstrap_turnoff_charge_screen.md
  full_cdac: docs/bootstrap_full_cdac_isolation.md
modules:
  - id: system
    title: 系统与架构
    subtitle: 规格 / 误差预算 / 行为基线
    coverage: 架构基线
  - id: sampling
    title: 采样与 Bootstrap
    subtitle: 获取 / 关断 / 保持 / 应力
    coverage: 本版完整样板
  - id: cdac
    title: CDAC 与 Reference
    subtitle: 底板采样 / 建立 / 参考驱动
    coverage: 局部证据
  - id: comparator
    title: 比较器
    subtitle: 再生 / 噪声 / 失调 / 回踢
    coverage: 局部证据
  - id: clock
    title: 时钟与控制
    subtitle: 相位 / 时间预算 / jitter
    coverage: 待补管级证据
  - id: integration
    title: 系统集成与版图
    subtitle: 转换 / PVT / MC / PEX
    coverage: 未整体验收
assumptions:
  temperature_k: 300.15
  temperature_note: kT/C 示例温度；沿用一阶模型 27 °C，不是额外冻结的工作温度。
  rss_note: 仅在不相关/等效误差假设下作架构预算。失真 guard 不是随机噪声证明；确定性保持误差、offset 不重复加进 RSS。
metrics:
  - id: lsb
    module: system
    title: 量化步长
    kind: derived
    formula: lsb
    unit: V
    display_unit: mV
    scale: 1000
    expression: LSB = Vspan,diff / 2ᴺ
    premise: 全差分范围 −0.9～+0.9 V；使用差分全跨度，而不是单端摆幅。
    sources: [spec, budget]
    parents: []
  - id: total
    module: system
    title: 总输入等效误差上限
    kind: derived
    formula: total
    unit: V
    display_unit: mV RMS
    scale: 1000
    expression: σtotal,max = Vsignal,rms · 10^(−SNDRmin/20)
    premise: SNDRmin = 6.02 × ENOBmin + 1.76；沿用项目 −1 dBFS 测试口径。包含量化误差，不能全部分给模拟模块。
    sources: [spec, budget]
    parents: [lsb]
  - id: quantization
    module: system
    title: 理想量化误差
    kind: derived
    formula: quantization
    unit: V
    display_unit: mV RMS
    scale: 1000
    expression: σq = LSB / √12
    premise: 均匀量化误差模型；并非对所有确定输入都严格满足的不相关噪声。
    sources: [budget]
    parents: [lsb]
  - id: analog
    module: system
    title: 模拟误差总余量
    kind: derived
    formula: analog
    unit: V
    display_unit: mV RMS
    scale: 1000
    expression: σanalog,max² = σtotal,max² − σq²
    premise: 量化项与模拟项不相关时的方差余量；若右侧小于零，预算不可行。
    sources: [budget]
    parents: [total, quantization]
  - id: sampling_noise
    module: sampling
    title: 采样热噪声分配
    kind: allocation
    formula: sampling_noise
    unit: V
    display_unit: mV RMS
    scale: 1000
    expression: σsample = αsample × LSB
    premise: αsample 暂分 0.18 LSB；是工程分配，不是唯一理论解。
    sources: [spec, budget]
    parents: [analog]
  - id: comparator_noise
    module: comparator
    title: 比较器噪声分配
    kind: allocation
    formula: comparator_noise
    unit: V
    display_unit: mV RMS
    scale: 1000
    expression: σcmp = αcmp × LSB
    premise: 输入等效 RMS 分配；管级噪声需要独立验证。
    sources: [spec, budget]
    parents: [analog]
  - id: reference_noise
    module: cdac
    title: Reference / 开关噪声分配
    kind: allocation
    formula: reference_noise
    unit: V
    display_unit: mV RMS
    scale: 1000
    expression: σref = αref × LSB
    premise: 暂定共享分配；实际开关误差可能相关或具有确定性，不能直接套 RSS。
    sources: [spec, budget]
    parents: [analog]
  - id: jitter
    module: clock
    title: 时钟 jitter 等效误差
    kind: model
    formula: jitter
    unit: V
    display_unit: mV RMS
    scale: 1000
    expression: σjitter ≈ 2π fin · Vsignal,rms · σt
    premise: 4.5 MHz 正弦、小且独立的采样抖动；σt = 20 ps 是暂定分配，不是测量结果。
    sources: [spec, first_order]
    parents: [analog]
  - id: distortion
    module: system
    title: 失真 / 未建模预留
    kind: allocation
    formula: distortion
    unit: V
    display_unit: mV RMS 等效
    scale: 1000
    expression: σguard = αguard × LSB
    premise: 仅作 RMS 等效 guard；需用实际谱分析验收谐波和总 SNDR。
    sources: [budget]
    parents: [analog]
  - id: capacitance
    module: sampling
    title: 每侧采样电容下限
    kind: model
    formula: capacitance
    unit: F
    display_unit: fF / side
    scale: 1.0e+15
    expression: Cside ≥ 2kT / σsample²
    premise: 两侧等值、独立 kT/C 噪声，T = 300.15 K。仅为热噪声下限，未包含匹配、寄生和实际电荷转移。
    sources: [first_order]
    parents: [sampling_noise]
  - id: settling
    module: cdac
    title: CDAC 建立残差分配
    kind: allocation
    formula: settling
    unit: V
    display_unit: mV abs
    scale: 1000
    expression: '|εsettle| ≤ 0.25 LSB'
    premise: 每次决策前的确定性残差约束；0.25 LSB 是当前分配，不是随机噪声项。
    sources: [spec, budget]
    parents: [lsb]
  - id: hold
    module: sampling
    title: 原始差分保持误差约束
    kind: allocation
    formula: hold
    unit: V
    display_unit: mV abs
    scale: 1000
    expression: '|Vheld,diff − Vtarget,diff| < εhold'
    premise: 采样实验沿用 0.25 LSB 思路；实验配置明确采用舍入值 0.439 mV。它不同于 0.316 mV RMS 热噪声，也不等于完整 ADC 的精度证明。
    sources: [full18_config, protected]
    parents: [settling]
  - id: offset
    module: comparator
    title: 比较器系统失调分配
    kind: allocation
    formula: offset
    unit: V
    display_unit: mV abs
    scale: 1000
    expression: '|Vos| ≤ αoffset × LSB'
    premise: 均值/系统偏差约束，与输入随机噪声分开审查；没有默认校准抵扣。
    sources: [spec, budget]
    parents: [lsb]
steps:
  - id: architecture
    module: system
    title: 架构与误差预算
    purpose: 把系统要求转换为可检验的初版约束。
    method: 解析公式 + 理想行为模型
    work: complete
    verdict: scoped
    coverage: 架构预算 / 理想模型
    result: 初版分配可在模型假设下闭合；不是物理实现验收。
    next: 用管级噪声、建立与功耗证据修订模块分配。
    metrics: [lsb, total, analog]
    evidence: [budget_baseline]
    depends_on: []
  - id: first_order
    module: sampling
    title: 获取与建立一阶模型
    purpose: 建立 C、R 与时间预算的可行域。
    method: 线性 RC / 独立 kT/C
    work: complete
    verdict: scoped
    coverage: 等效电路 / 标称
    result: 40 ns 获取、226.396 fF 示例给出总电阻约 21.242 kΩ 的条件上限；不验证关断注入。
    next: 约束真实开关，并保留电荷注入和动态非线性测试。
    metrics: [capacitance, hold]
    evidence: [rc_model]
    depends_on: [architecture]
  - id: main_switch
    module: sampling
    title: Bootstrap 主开关筛选
    purpose: 分离主 MOS 的 Ron 能力与驱动器动态误差。
    method: T28 MOS + 理想 Vgate = Vin + VDD
    work: complete
    verdict: scoped
    coverage: 27 PVT 组合 / 理想栅驱动
    result: 1.8 V、L150/W8.96 候选最坏 Ron 964.5 Ω；这不是完整 Bootstrap 驱动通过。
    next: 加入实际驱动、体端连接与关断时序。
    metrics: [hold]
    evidence: [main_screen]
    depends_on: [first_order]
  - id: protected
    module: sampling
    title: 混合电压驱动候选
    purpose: 同时核对端子电压筛查与原始采样保持误差。
    method: T28 MOS + 理想 50/50/200 fF 电容 + 理想时钟
    work: complete
    verdict: fail
    coverage: 单输入 / TT · 0.9 V · 27 °C
    result: Full-control 无 CMI-275x 告警，保持误差 −8.755 mV；未达到 0.439 mV 分配。
    next: 不能只继续降 Ron；先诊断关断电荷与保持输入加载。
    metrics: [hold]
    evidence: [protected_screen]
    depends_on: [main_switch]
  - id: audit
    module: sampling
    title: 关断电流与电荷审计
    purpose: 区分关断形成的误差与后续保持阶段的输入加载。
    method: 原 OA 导出网表 + 端子电流 / 电荷积分 / KCL
    work: complete
    verdict: diagnostic
    coverage: 同一静态输入 / TT / 无 OA 改动
    result: MN9 输入加载通路已确认；关断期间形成主要保持误差，唯一寄生归因尚未完成。
    next: 新建独立拓扑消融实验，先去掉不期望的保持通路，再单因素调整隔离与关断时序。
    metrics: [hold]
    evidence: [current_audit]
    depends_on: [protected]
  - id: fast_ab
    module: sampling
    title: 网表级快速 A/B
    purpose: 区分去除输入加载、提前 PHIB 和分离主栅控制的影响。
    method: 复制网表上的 T28 器件修改 / 理想继电器机理边界
    work: complete
    verdict: fail
    coverage: 八个变体 / 单点 TT / 未改 OA
    result: 厚栅 MN9 去加载后误差 −6.842 mV；分离主栅理想边界 −2.482 mV，仍未达标。
    next: 独立实现 T28 主栅控制与安全复位，再验证电流、误差和端子应力。
    metrics: [hold]
    evidence: [fast_ab]
    depends_on: [audit]
  - id: topology
    module: sampling
    title: 独立拓扑修订与消融
    purpose: 在 CDAC 底板切换后仍维持安全关断，并处理真实钳位扰动。
    method: 计划：独立 OA 候选 + 同条件 A/B 实验
    work: planned
    verdict: unverified
    coverage: 未运行
    result: 完整 CDAC 已确认 VIN 关断可重新导通；理想 VSS 隔离有效，真实门控与钳位尚未通过。
    next: 并行收敛物理 GMAIN 控制及顶板/分裂节点钳位，再在同一夹具联合验证。
    metrics: [hold]
    evidence: [isolate_reset, turnoff_charge, full_cdac]
    depends_on: [fast_ab]
  - id: sampler_acceptance
    module: sampling
    title: 采样模块联合验收
    purpose: 在完整负载与工况下联合满足精度、噪声、应力及时间要求。
    method: 待执行：全输入范围 / PVT / MC / 噪声 / 完整 CDAC
    work: blocked
    verdict: unverified
    coverage: 未整体覆盖
    result: 单点误差、输入加载和可靠性边界仍阻塞联合验收。
    next: 候选拓扑先通过同条件筛查，再扩展覆盖；无告警不等于寿命签核。
    metrics: [sampling_noise, hold]
    evidence: []
    depends_on: [topology]
  - id: bottom_plate
    module: cdac
    title: 完整 CDAC 底板 / 钳位实验
    purpose: 比较理想钳位与真实器件的采样电荷转移。
    method: 完整 5+5 CDAC + T28 开关；不同于单电容夹具
    work: complete
    verdict: fail
    coverage: TT / 理想钳位五输入 / 真实钳位 VSS 关断仅 +0.8 V
    result: 理想 VSS 门控与理想钳位最大误差 0.004218 mV；真实钳位单点 −7.538 mV，尚未通过。
    next: 分解钳位释放扰动与节点耦合，同步解决应力并与物理 GMAIN 联合验证。
    metrics: [settling, hold]
    evidence: [bottom_screen, full_cdac]
    depends_on: [architecture]
  - id: reference
    module: cdac
    title: Reference 建立与驱动
    purpose: 约束每 bit 的参考网络建立。
    method: 一阶 Rref + Ron + Cside；未认定真实 buffer 完成
    work: planned
    verdict: unverified
    coverage: 已有一阶约束 / 管级证据待整理
    result: 3 ns、226.396 fF 示例约束总电阻 ≤ 1.593 kΩ；不是固定生产尺寸。
    next: 明确参考驱动架构并导入管级建立、噪声、功耗证据。
    metrics: [reference_noise, settling]
    evidence: [rc_model]
    depends_on: [architecture]
  - id: strongarm
    module: comparator
    title: StrongARM 与 CDAC 接口
    purpose: 检查真实动态比较器的决策和回踢。
    method: T28 StrongARM + 完整 split CDAC；无噪声瞬态
    work: complete
    verdict: fail
    coverage: 6 TT 实验 / 不是完整 SAR 转换
    result: ±0.439453 mV 输入决策 224.116 ps；决策时扰动约 0.365 mV。已有噪声/失调筛查未通过。
    next: 同时优化噪声、失调、回踢；确定性正确判决不覆盖 MC 或噪声验收。
    metrics: [comparator_noise, offset]
    evidence: [strongarm_interface]
    depends_on: [bottom_plate]
  - id: clock_plan
    module: clock
    title: 相位与时序约束
    purpose: 约束采样、每 bit 建立、决策和逻辑开销。
    method: 相位时序与抖动敏感度；不是静态 AC
    work: planned
    verdict: unverified
    coverage: 40 ns 获取 / 60 ns 转换 / 5 ns bit
    result: 当前 20 ps jitter 是分配；物理时钟实现与负载证据待补。
    next: 联合开关关断顺序定义非重叠、边沿与实际时钟负载。
    metrics: [jitter]
    evidence: [rc_model]
    depends_on: [architecture]
  - id: integration
    module: integration
    title: 宏模型到管级全转换
    purpose: 以闭环转换验证实际模块组合。
    method: 已有电气宏模型；完整管级转换未验收
    work: blocked
    verdict: unverified
    coverage: 宏模型 ≠ 全管级 / 无 PEX 验收
    result: 保留宏模型参考，不能用它替代真实开关与比较器的模块关口。
    next: 先关闭采样和比较器关键问题，再做完整转换、DNL/INL、SNDR、功耗及后仿。
    metrics: [total]
    evidence: [macro_model]
    depends_on: [sampler_acceptance, strongarm, reference, clock_plan]
circuits:
  - id: bootstrap_full18
    modules: [sampling]
    library: SAR_ADC_T28
    cell: sar_bootstrap_protected_full18_eval
    testbench: tb_sar_bootstrap_protected_full18_eval
    view: schematic
    netlist_sha256: f466793e8655f2d81bdb7ce98d1041f00cdd90a374be3341750d2cb22a9bdd4d
    evidence: [protected_screen, current_audit]
    note: 已记录导出网表版本；本工作台未连接或重新核对当前 OA。历史导出一致不代表远端现状一致。
  - id: cdac_strongarm
    modules: [cdac, comparator]
    library: SAR_ADC_T28
    cell: tb_sar_cdac_strongarm_diag
    testbench: tb_sar_cdac_strongarm_diag
    view: schematic
    netlist_sha256: 046ff86701d1a8e7bc6973be5c8885d64d844fbc67cc7ea150cee78ffa02fe28
    evidence: [strongarm_interface]
    note: CDAC / 比较器接口历史版本；未执行新 readback。与单电容 Bootstrap fixture 不可直接横比。
