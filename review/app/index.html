<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>SAR ADC · 设计流程</title>
  <style>__STYLE__</style>
</head>
<body>
  <header class="topbar"><div><span class="brand">SAR /</span><h1>ADC 设计流程</h1><span id="spec-line"></span></div><span class="snapshot-label">设计状态快照</span></header>
  <main>
    <nav class="view-toolbar" aria-label="当前位置"><span id="breadcrumb">全 ADC / 设计总图</span><button id="show-all" class="quiet-button" hidden>← 返回全 ADC</button></nav>
    <div id="stale-banner" class="stale-note" hidden>部分设计记录有更新，下面的历史结论需要复核。</div>
    <section id="view" aria-labelledby="flow-title">
      <div class="flow-heading"><div><h2 id="flow-title"></h2><p id="flow-note"></p></div><div id="legend" class="legend"></div></div>
      <div class="diagram-scroll"><div id="flow-canvas"><svg id="flow-edges" aria-hidden="true"></svg><div id="flow-nodes"></div></div></div>
      <p id="budget-footnote" class="graph-footnote"></p>
    </section>
    <footer><span>初始分配可以迭代 · 完成实验不等于指标通过</span><span id="review-date"></span></footer>
  </main>
  <dialog id="figure-dialog" aria-labelledby="figure-title">
    <div class="figure-header"><div><span id="figure-kind"></span><h2 id="figure-title"></h2></div><button id="close-figure" class="quiet-button" autofocus>关闭图表 ×</button></div>
    <p id="figure-caption"></p>
    <div class="figure-scroll"><img id="figure-image" alt=""></div>
  </dialog>
  <script id="review-data" type="application/json">__DATA__</script>
  <dialog id="topology-dialog" aria-labelledby="topology-title">
    <div class="figure-header"><div><h2 id="topology-title"></h2></div><button id="close-topology" class="quiet-button" autofocus>关闭电路 ×</button></div>
    <div id="phase-controls" class="topology-controls" aria-label="工作相位"></div>
    <p id="phase-explanation"></p>
    <div class="topology-layout">
      <div><div id="topology-picture"></div><p class="topology-key">蓝框：关注器件 · 橙线：关联网络</p><div id="group-controls" class="topology-controls"></div><p id="group-explanation"></p></div>
      <aside><h3>分析主题</h3><div id="topic-controls" class="topology-controls"></div><div id="topic-explanation"></div><div id="device-explanation"></div></aside>
    </div>
    <details class="inline-detail"><summary>模型约定与版本</summary><p id="topology-notice"></p><p id="topology-mapping"></p></details>
  </dialog>
  <script>__FORMULAS__</script>
  <script>__APP__</script>
  <script>__TOPOLOGY__</script>
</body>
</html>
