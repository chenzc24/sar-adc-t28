# Copy to ignored site.local.yaml. Use your existing SSH configuration.
roots:
  remote_host: YOUR_SSH_ALIAS
  new_run_root: /YOUR/OWNED/LOCAL_SSD/sar-adc-t28/runs
resource_policy:
  concurrent_heavy_workloads: 7
  policy_file: work/state/execution_policy.json
# The retained T28 remote adapter validates its owned workspace and account.
# Changing accounts or PDK installation requires adapting and validating that adapter.
layout:
  host: YOUR_SSH_ALIAS
  remote_root: /YOUR/OWNED/LOCAL_SSD/sar-adc-t28/layout
  legacy_root: /YOUR/OWNED/LOCAL_SSD/sar-adc-t28/layout-mom-pilot
  library: SAR_ADC_T28_LAYOUT
  library_path: /YOUR/OWNED/HOME/llm_IO/SAR_ADC_T28_LAYOUT
  allow_regeneration: false
