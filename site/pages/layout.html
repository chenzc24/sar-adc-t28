<section class="page-intro">
  <h1 id="assembly-title">Layout<span class="title-period">.</span></h1>
  <p class="mono minor">r8 unfilled · 892 × 892 µm · LayoutML TSMC28 DRF</p>
</section>

<section class="section first-section" id="assembly" aria-labelledby="assembly-title">
  <div class="layout-explorer" id="chip-viewer">
    <div class="layout-toolbar" aria-label="Layout controls">
      <div class="layout-tools">
        <button type="button" data-layout-action="in" aria-label="Zoom in">+</button>
        <button type="button" data-layout-action="out" aria-label="Zoom out">−</button>
        <button type="button" data-layout-action="fit">Fit die</button>
        <button type="button" data-layout-action="box" aria-pressed="false">Box zoom</button>
      </div>
      <button type="button" data-layout-action="fullscreen">Full screen</button>
    </div>
    <div class="layout-work-area">
      <div class="layout-stage">
        <canvas id="layout-canvas" tabindex="0" aria-label="Interactive r8 SAR ADC die layout" aria-describedby="layout-help"></canvas>
        <div id="layout-zoom-box" class="layout-zoom-box" hidden></div>
        <p id="layout-loading" class="layout-loading" role="status">Loading the r8 chip layout…</p>
      </div>
      <aside class="layout-sidebar" aria-label="Layout navigation">
        <h3>Go to</h3>
        <div class="layout-landmarks" id="layout-landmarks"></div>
        <h3>Layers</h3>
        <label class="layout-label-toggle"><input type="checkbox" id="layout-terminal-labels" checked> D/S labels</label>
        <div class="layout-layers" id="layout-layers"></div>
      </aside>
    </div>
    <div class="layout-footer"><span id="layout-location">Die view</span><span id="layout-scale"></span></div>
  </div>
  <p id="layout-help" class="evidence-line">Left or middle drag to pan. Scroll or pinch to zoom. D/S labels appear at transistor scale.</p>
  <p class="link-row" id="physical-checks"><a href="verification.html#physical-checks">Physical checks →</a><a id="routing" href="verification.html#routing">Peripheral loading →</a><a href="${asset_base}layout-data/release.json">GDS and layer map ↗</a><a href="$snapshot/Layout/design/io_ring.json">Pad plan ↗</a></p>
  <script src="https://liixtt.github.io/LayoutML/assets/renderer/webgl-canvas.js" crossorigin="anonymous" defer></script>
  <script src="${asset_base}assets/layout-view.js?display=terminals" defer></script>
</section>
