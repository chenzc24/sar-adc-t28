<section class="page-intro">
  <div class="page-intro-copy">
    <h1 id="native-title">原理图</h1>
    <p class="lead">双击模块进入子电路。</p>
  </div>
  <div class="actions">
    <a class="button button-primary" href="$rnl_full" target="_blank" rel="noopener">完整 RNL 查看器 <span aria-hidden="true">↗</span></a>
    <a class="button button-outline" href="${asset_base}$rnl_entry">RNL 源码 <span aria-hidden="true">↗</span></a>
  </div>
</section>

<section class="section" aria-labelledby="native-title">
  <div class="schematic-toolbar">
    <nav class="jump-links schematic-links" aria-label="原理图层次">$rnl_links</nav>
    <span class="mono minor">RNL $rnl_version · $rnl_revision</span>
  </div>
  <iframe class="schematic-frame" name="rnl-frame" title="RNL 官方查看器" src="$rnl_embed" allowfullscreen></iframe>
  <script src="${asset_base}assets/schematic-view.js" defer></script>
