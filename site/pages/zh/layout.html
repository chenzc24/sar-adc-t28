<section class="page-intro">
  <h1 id="assembly-title">版图<span class="title-period">.</span></h1>
  <p class="mono minor">r8 无填充 · 892 × 892 µm · LayoutML TSMC28 DRF</p>
</section>

<section class="section" id="assembly" aria-labelledby="assembly-title">
  <div class="layout-explorer" id="chip-viewer">
    <div class="layout-toolbar" aria-label="版图操作">
      <div class="layout-tools">
        <button type="button" data-layout-action="in" aria-label="放大">+</button>
        <button type="button" data-layout-action="out" aria-label="缩小">−</button>
        <button type="button" data-layout-action="fit">整片适配</button>
        <button type="button" data-layout-action="box" aria-pressed="false">框选放大</button>
      </div>
      <button type="button" data-layout-action="fullscreen">全屏</button>
    </div>
    <div class="layout-work-area">
      <div class="layout-stage">
        <canvas id="layout-canvas" tabindex="0" aria-label="r8 SAR ADC 交互版图" aria-describedby="layout-help"></canvas>
        <div id="layout-zoom-box" class="layout-zoom-box" hidden></div>
        <p id="layout-loading" class="layout-loading" role="status">正在加载 r8 版图…</p>
      </div>
      <aside class="layout-sidebar" aria-label="版图导航">
        <h3>定位</h3>
        <div class="layout-landmarks" id="layout-landmarks"></div>
        <h3>图层</h3>
        <label class="layout-label-toggle"><input type="checkbox" id="layout-terminal-labels" checked> D/S 漏源标注</label>
        <div class="layout-layers" id="layout-layers"></div>
      </aside>
    </div>
    <div class="layout-footer"><span id="layout-location">整片</span><span id="layout-scale"></span></div>
  </div>
  <div class="layout-details">
    <p id="layout-help" class="evidence-line">左键或中键拖动平移，滚轮或双指缩放。放大到晶体管尺度可见 D/S 标注。</p>
    <p class="link-row" id="physical-checks"><a href="verification.html#physical-checks">物理检查 →</a><a id="routing" href="verification.html#routing">外围走线负载 →</a><a href="${asset_base}layout-data/release.json">GDS 与层表 ↗</a><a href="$snapshot/Layout/design/io_ring.json">焊盘规划 ↗</a></p>
  </div>
  <script src="https://liixtt.github.io/LayoutML/assets/renderer/webgl-canvas.js" crossorigin="anonymous" defer></script>
  <script src="${asset_base}assets/layout-view.js?display=terminals" defer></script>
</section>
