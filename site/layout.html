<!doctype html>
<html lang="$locale">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <meta name="theme-color" content="#f6f7f2">
  <title>$title</title>
  <link rel="stylesheet" href="${asset_base}assets/project.css">
  <link rel="stylesheet" href="${asset_base}assets/layout-view.css">
  <script src="${asset_base}assets/language.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">$skip</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>SAR ADC <small>T28</small></span>
      </a>
      <nav class="site-nav" aria-label="$nav_label">
        $navigation
      </nav>
      <div class="header-actions">
        <a class="repo-link" id="language-switch" href="$language_link" hreflang="$switch_locale" lang="$switch_locale">$switch_label</a>
        <a class="repo-link" href="$repository">GitHub <span aria-hidden="true">↗</span></a>
      </div>
    </div>
  </header>
  <main class="shell" id="main">
    $content
  </main>
  <footer class="site-footer">
    <div class="shell footer-inner">
      <strong>SAR ADC T28</strong>
      <a href="$repository/commit/$revision">$evidence_label · <code>$short_revision</code> <span aria-hidden="true">↗</span></a>
    </div>
  </footer>
</body>
</html>
