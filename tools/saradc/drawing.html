<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAR8 · RNL 原理图</title>
<style>
:root{font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;color:#19364a;background:#f5f7f9}*{box-sizing:border-box}body{margin:0}button,select,input,a{font:inherit}button,select,input{border:1px solid #c8d3dc;border-radius:5px;background:white;padding:6px 9px;color:inherit}button,a,select{cursor:pointer}button:hover,a:hover{background:#e6eff5}a{color:#176193;text-decoration:none}header{height:64px;display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid #d9e1e7;background:white}header strong{font-size:21px}header span{color:#647c8e}main{display:grid;grid-template-columns:258px minmax(0,1fr);height:calc(100vh - 64px)}aside{overflow:auto;border-right:1px solid #d9e1e7;padding:18px 14px;background:#edf2f6}aside h2{font-size:12px;color:#657c8b;letter-spacing:.08em;margin:20px 6px 7px}aside button{display:block;width:100%;text-align:left;border:0;background:transparent;margin:3px 0;padding:8px 10px}aside button.selected{background:#d7e7f1;color:#07547c;font-weight:600}#search{width:100%}#levels button{font:12px/1.45 ui-monospace,Consolas,monospace;overflow-wrap:anywhere;padding:6px 8px}.workspace{min-width:0;display:flex;flex-direction:column}.toolbar{padding:14px 18px 10px;background:white;border-bottom:1px solid #dde4e9;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar h1{font:600 17px ui-monospace,Consolas,monospace;margin:0 12px 0 0;flex:1;overflow-wrap:anywhere}.meta{padding:9px 18px;color:#657986;font-size:12px;display:flex;gap:16px;align-items:center}.meta #status{margin-left:auto}.stage{position:relative;flex:1;min-height:300px;background:white;margin:0 16px;border:1px solid #dbe2e7;border-radius:5px;overflow:hidden}.stage iframe{width:100%;height:100%;border:0}.stage #drawing{height:100%;width:100%;overflow:auto}#drawing svg{display:block;width:100%;height:100%;min-height:400px}#drawing [data-id]{cursor:pointer}#drawing [data-id]:hover{filter:drop-shadow(0px 0px 3px #70a3c0)}#source{margin:0;height:100%;overflow:auto;padding:20px;background:#f8fafc;font:12px/1.7 Consolas,monospace;white-space:pre}#children{padding:12px 18px 15px;max-height:108px;overflow:auto;display:flex;gap:7px;flex-wrap:wrap}#children button{font:12px Consolas,monospace;padding:4px 8px}.notice{font-size:12px;color:#637b89;margin:8px 6px}#candidate{width:100%;font-size:12px}#mode{font-size:12px}button[aria-pressed=true]{background:#d7e7f1;border-color:#8aafc4}.stage [hidden]{display:none!important}@media(max-width:800px){main{grid-template-columns:190px 1fr}header span{display:none}.toolbar{padding:10px}.meta{display:block}aside{padding:10px}.toolbar h1{flex-basis:100%}}
</style>
<header><strong>SAR8</strong><span>网表原理图 · RNL 0.3</span><span style="margin-left:auto">当前设计 / 8 bit · 10 MS/s</span></header>
<main><aside><nav id="modules" aria-label="主要模块"></nav>
<h2>实现候选</h2><select id="candidate" aria-label="实现候选"></select><p class="notice" id="candidate-note">当前选择不改变仿真默认值。</p>
<h2>全部层次</h2><input id="search" placeholder="搜索子电路 / 测试台" aria-label="搜索子电路"><div id="levels"></div>
<p class="notice">VA 与标准库只显示接口。RNL 展示不代表 OA 已同步，也不代表电气验收通过。</p>
</aside><section class="workspace">
<div class="toolbar"><button id="back" title="返回上一层">←</button><h1 id="title"></h1><button id="view-rnl" aria-pressed="true">原理图</button><button id="view-source" aria-pressed="false">网表</button><button id="export-svg">导出 SVG</button><button id="export-source">导出网表</button><a id="full" target="_blank" rel="noopener">完整 RNL 查看器 ↗</a></div>
<div class="meta"><span id="identity"></span><span id="status" role="status"></span><button id="mode">静态预览</button></div>
<div class="stage"><iframe id="viewer" title="官方 RNL 查看器" hidden></iframe><div id="drawing"></div><pre id="source" hidden></pre></div>
<div id="children" aria-label="可进入的子电路"></div>
</section></main>
<script>
const DATA=/*DRAWINGS*/;
const $=id=>document.getElementById(id), history=[];
let levels=DATA.levels;
const moduleRows=[['顶层 · ADC','sar_adc8_join_r4',null],['Bootstrap 采样','sar_bootstrap_flat_8b_p','sampler'],['MOM CDAC','sar8j_r1_cdac','cdac'],['StrongARM 比较器','sar_strongarm_t28','comparator'],['异步 SAR 控制','sar8i_ctrl','sar'],['参考与非交叠','sar8i_refword','reference'],['RC / 时钟延时','sar8p_delay_valid','timing']];
let level=levels[location.hash.slice(1)]?location.hash.slice(1):DATA.default_level, nativeMode=location.protocol!=='file:', page='rnl', activeCandidate='', workspace=DATA.workspace;
function button(text,fn){const b=document.createElement('button');b.textContent=text;b.onclick=fn;return b;}
for(const [label,n] of moduleRows){const b=button(label,()=>openLevel(n,true,true));b.dataset.level=n;$('modules').append(b);}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function list(){const key=$('search').value.toLowerCase();$('levels').replaceChildren();for(const n of Object.keys(levels).filter(n=>n.toLowerCase().includes(key))){const b=button(n,()=>openLevel(n));b.dataset.level=n;$('levels').append(b);}}
function choices(){const mod=moduleRows.find(r=>r[1]===level)?.[2]||activeCandidate.split('=')[0];$('candidate').replaceChildren();const all=document.createElement('option');all.value='';all.textContent='当前选定实现';$('candidate').append(all);for(const r of DATA.candidates.filter(r=>r.module===mod)){const o=document.createElement('option');o.value=r.module+'='+r.candidate;o.textContent=r.candidate+' · '+(r.selected?'当前实现':'未提升候选');$('candidate').append(o);} $('candidate').disabled=!mod; $('candidate').value=activeCandidate;$('candidate-note').textContent=activeCandidate?'候选 '+activeCandidate+'：仅切换展示，不改变默认实现或验收状态。':'当前选择不改变仿真默认值。';}
function viewerUrl(embed){const u=new URL('/viewer/',location.href);u.searchParams.set('manifest',new URL(workspace,location.href));u.searchParams.set('level',level);u.searchParams.set('lang','zh-CN');if(embed){u.searchParams.set('embed','1');u.searchParams.set('origin',location.origin);}return u.href;}
function show(reload=true){const d=levels[level];$('title').textContent=level;$('identity').textContent=d.meta.kind+' · '+d.meta.instances+' 个实例 · '+d.meta.source;location.hash=level;
 $('source').textContent=d.source;$('source').hidden=page!=='source';$('drawing').hidden=page==='source'||nativeMode;$('viewer').hidden=page==='source'||!nativeMode;
 $('view-rnl').setAttribute('aria-pressed',page==='rnl');$('view-source').setAttribute('aria-pressed',page==='source');
 if(nativeMode){if(reload)$('viewer').src=viewerUrl(true);$('full').href=viewerUrl(false);$('full').hidden=false;if(reload)$('status').textContent='正在载入官方 RNL 查看器';}
 else{$('drawing').innerHTML=d.svg;$('full').hidden=true;$('status').textContent=location.protocol==='file:'?'离线 SVG · 运行 draw --serve 可进入官方查看器':'静态 SVG';}
 $('mode').textContent=nativeMode?'静态预览':'官方查看器';$('mode').disabled=location.protocol==='file:';
 $('children').replaceChildren();for(const c of d.meta.children)$('children').append(button(c.instance+' → '+c.level,()=>openLevel(c.level)));
 for(const b of document.querySelectorAll('[data-level]'))b.classList.toggle('selected',b.dataset.level===level);choices();
}
function openLevel(n,push=true,reset=false){if(!levels[n])return;if(push&&level!==n)history.push(level);level=n;if(reset){activeCandidate='';workspace=DATA.workspace;levels=DATA.levels;}page='rnl';show();}
$('search').oninput=list;$('back').onclick=()=>{if(history.length)openLevel(history.pop(),false)};
$('view-source').onclick=()=>{page='source';show()};$('view-rnl').onclick=()=>{page='rnl';show()};
$('mode').onclick=()=>{nativeMode=!nativeMode;show()};
$('export-svg').onclick=()=>download(level+'.svg',levels[level].svg,'image/svg+xml');
$('export-source').onclick=()=>download('sar8-rnl-export.scs',DATA.candidates.find(r=>r.module+'='+r.candidate===activeCandidate)?.export_source||DATA.export_source,'text/plain');
$('drawing').ondblclick=e=>{const n=e.target.closest('[data-id]')?.dataset.id?.replace(/^#/,'');const c=levels[level].meta.children.find(c=>c.instance===n);if(c)openLevel(c.level)};
$('candidate').onchange=()=>{activeCandidate=$('candidate').value;if(!activeCandidate||DATA.candidates.find(r=>r.module+'='+r.candidate===activeCandidate)?.selected){workspace=DATA.workspace;levels=DATA.levels;show();return;}
 const row=DATA.candidates.find(r=>r.module+'='+r.candidate===activeCandidate);if(!row.workspace){$('status').textContent='该候选尚无展示包，请重新运行 draw';return;}workspace=row.workspace;levels={...DATA.levels,...row.changed_levels};nativeMode=location.protocol!=='file:';show();$('candidate-note').textContent='候选 '+activeCandidate+'：仅切换展示，不改变默认实现或验收状态。';};
window.addEventListener('message',e=>{if(e.source!==$('viewer').contentWindow||e.origin!==location.origin)return;const m=e.data;if(m?.rnl===1&&m.type==='level'&&levels[m.name]&&m.name!==level){history.push(level);level=m.name;show(false);return;}if(m?.rnl===1&&m.type==='loaded')$('status').textContent='官方 RNL · '+DATA.viewer_version;else if(m?.rnl===1&&m.type==='error')$('status').textContent='RNL 加载失败：'+(m.message||m.error||'查看控制台');});
list();show();
</script></html>
