  differential_full_scale_v: 1.8
  temperature_k: 300.15
  sampling_noise_rms_lsb: 0.18
  settling_abs_max_lsb: 0.25
  bit_cycle_ns: 5.0

split_cdac:
  architecture: 5_plus_5
  msb_subarray_units: 32.0
  lsb_subarray_units: 32.0
  ideal_bridge_units: 1.032258064516129
  lsb_series_equivalent_units: 1.0
  comparator_side_units: 33.0
  parasitic_capacitance_ff: 0.0

scan:
  unit_capacitance_ff: [1.0, 2.0, 2.5, 3.0, 4.0, 6.86047, 8.0, 16.0, 35.6304]
  settling_time_ns: [2.0, 2.5, 3.0, 4.0]
