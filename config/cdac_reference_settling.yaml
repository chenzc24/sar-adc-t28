  switch_resistance_ohm: [100.0, 250.0, 500.0, 1000.0, 1500.0, 2000.0, 3000.0, 5000.0]

representative_spectre_cases:
  - name: characterized_default_feasible
    unit_capacitance_ff: 6.86047
    settling_time_ns: 3.0
    reference_resistance_ohm: 500.0
    switch_resistance_ohm: 1000.0
  - name: characterized_default_settling_fail
    unit_capacitance_ff: 6.86047
    settling_time_ns: 3.0
    reference_resistance_ohm: 500.0
    switch_resistance_ohm: 1500.0
  - name: small_cap_noise_fail
    unit_capacitance_ff: 2.0
    settling_time_ns: 3.0
    reference_resistance_ohm: 500.0
    switch_resistance_ohm: 1000.0
  - name: characterized_specimen_near_boundary
    unit_capacitance_ff: 35.6304
    settling_time_ns: 3.0
    reference_resistance_ohm: 100.0
    switch_resistance_ohm: 200.0

spectre:
  single_ended_step_v: 0.9
  step_delay_ns: 1.0
  rise_time_ps: 1.0
  stop_time_ns: 6.0
  max_step_ps: 2.0
