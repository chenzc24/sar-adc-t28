stage: bootstrap_driver_error_reduction_screen

conditions:
  supply_v: 0.90
  temperature_c: 27
  common_mode_v: 0.45
  load_f: 2.195e-13
  screen_differential_input_v: 0.80
  confirm_differential_input_v: [-0.80, -0.40, 0.0, 0.40, 0.80]
  confirm_single_input_v: [0.05, 0.45, 0.85]

baseline:
  mn7_multi: 2
  mn10_multi: 4
  mp8_multi: 4
  nonoverlap_s: 1.0e-9

one_factor:
  mn7_multi: [1, 2, 4, 8]
  mn10_multi: [2, 4, 8, 16]
  mp8_multi: [1, 2, 4, 8]
  nonoverlap_s: [2.0e-10, 5.0e-10, 1.0e-9, 2.0e-9]

# Selected after the one-factor screen; every entry remains explicit and audited.
combination_candidates:
  - name: mn7_8_mn10_16
    mn7_multi: 8
    mn10_multi: 16
  - name: mn7_8_mp8_1
    mn7_multi: 8
    mp8_multi: 1
  - name: mn7_8_gap_0200p
    mn7_multi: 8
    nonoverlap_s: 2.0e-10
  - name: best_one_factor_combo
    mn7_multi: 8
    mn10_multi: 16
    mp8_multi: 1
    nonoverlap_s: 2.0e-10
  - name: mn7_extreme_16
    mn7_multi: 16
  - name: mn10_extreme_32
    mn10_multi: 32
  - name: discharge_extreme
    mn7_multi: 16
    mn10_multi: 32
    mp8_multi: 1
    nonoverlap_s: 2.0e-10

# Selected after the combination screen. Baseline is always confirmed.
confirmation_candidates:
  - best_one_factor_combo
  - discharge_extreme

timing:
  input_step_s: 2.05e-7
  sample_start_s: 2.11e-7
  sample_end_s: 2.50e-7
  hold_measure_s: 2.70e-7
  stop_s: 3.20e-7
  clock_period_s: 1.0e-7
  edge_s: 1.0e-10

source:
  resistance_ohm: 50.0

targets:
  maximum_acquisition_error_v: 4.39e-4
  maximum_held_error_v: 4.39e-4
  minimum_sample_vgs_v: 0.70
  maximum_sample_vgs_v: 1.05

scope_limits:
  - TT 0.9-V 27-C topology-preserving diagnostic only
  - generated netlists are analysis wrappers around one exact OA export
  - multiplier edits change drive and parasitic charge together
  - no mismatch, noise, extracted parasitics, PVT, power, or reliability sign-off
