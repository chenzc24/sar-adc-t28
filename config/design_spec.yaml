project:
  name: SAR_ADC_T28
  maturity: electrical_macro_and_native_sampling_nominal_baseline

process:
  foundry: TSMC
  node_nm: 28
  platform: CRN28HPC+ULL
  technology_library: tsmcN28

converter:
  architecture: fully_differential_sar
  resolution_bits: 8
  sample_rate_hz: 10000000
  # Preserved executable synchronous fixtures only; not the selected bit loop.
  internal_sar_clock_hz: 200000000
  internal_sar_clock_role: legacy_synchronous_fixture_only
  cdac_partition: flat_binary
  comparator: strongarm_dynamic
  control: asynchronous
  control_contract: config/sar8_simple.yaml
  control_implementation: native_simple_async_bounded_verified_SOA_and_integration_open

supplies:
  vdd_v: 0.9
  vss_v: 0.0
  vrefp_v: 0.9
  vrefn_v: 0.0
  input_common_mode_v: 0.45

input:
  mode: differential
  differential_range_v: [-0.9, 0.9]
  dynamic_test_level_dbfs: -1.0

timing_budget:
  sample_ns: 40.0
  conversion_ns: 60.0
  # Historical fixed-bit fixture; async delays are separately budgeted.
  bit_cycle_ns: 5.0

targets:
  enob_min_bits: 7.0
  dnl_abs_max_lsb: 1.0
  inl_abs_max_lsb: 1.0
  power_max_mw: 1.0
  missing_codes_allowed: 0

behavioral_baseline:
  fft_samples: 16384
  coherent_bin: 7373
  ramp_samples_per_code: 8

# Sampling transfer acceptance is separated in config/sampling_acceptance.yaml.
# Fixed phase delay is not added to random-noise RSS; numerical budgets below
# are unchanged. CDAC settling and comparator offset retain their own guards.
error_budget:
  sampling_noise_rms_lsb: 0.18
  comparator_noise_rms_lsb: 0.18
  reference_switching_noise_rms_lsb: 0.12
  distortion_unmodeled_rms_lsb: 0.15
  clock_jitter_rms_ps: 20.0
  jitter_budget_input_hz: 4500000
  cdac_settling_abs_max_lsb: 0.25
  comparator_offset_abs_max_lsb: 0.25
