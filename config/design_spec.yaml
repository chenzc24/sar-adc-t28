project:
  name: SAR_ADC_T28
  maturity: architecture_baseline

process:
  foundry: TSMC
  node_nm: 28
  platform: CRN28HPC+ULL
  technology_library: tsmcN28

converter:
  architecture: fully_differential_sar
  resolution_bits: 10
  sample_rate_hz: 10000000
  internal_sar_clock_hz: 200000000
  cdac_partition: 5_plus_5_split
  comparator: strongarm_dynamic
  control: synchronous

supplies:
  vdd_v: 0.9
  vss_v: 0.0
  vrefp_v: 0.9
  vrefn_v: 0.0
  input_common_mode_v: 0.45

input:
  mode: differential
  differential_range_v: [-0.9, 0.9]
  dynamic_test_level_dbfs: -1.0

timing_budget:
  sample_ns: 40.0
  conversion_ns: 60.0
  bit_cycle_ns: 5.0

targets:
  enob_min_bits: 9.0
  dnl_abs_max_lsb: 1.0
  inl_abs_max_lsb: 1.0
  power_max_mw: 1.0
  missing_codes_allowed: 0

