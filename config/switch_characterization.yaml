stage: transmission_gate_switch_characterization

conditions:
  process: TT
  temperature_c: 27
  supply_v: 0.9
  signal_common_mode_start_v: 0.001
  signal_common_mode_stop_v: 0.899
  signal_common_mode_step_v: 0.01
  differential_probe_v: 0.001

devices:
  nmos: tsmcN28/nch_mac
  pmos: tsmcN28/pch_mac
  length_m: 3.0e-8
  finger_width_m: 2.5e-7

sweep:
  nmos_multipliers: [2, 4, 6, 8]
  pmos_to_nmos_ratios: [1.0, 1.5, 2.0]

targets:
  maximum_on_resistance_ohm: 1000.0
  macro_reference_resistance_ohm: 100.0
  macro_combined_resistance_ohm: 1100.0

scope_limits:
  - nominal TT only
  - no extracted layout parasitics
  - no charge injection or clock feedthrough measurement
  - no switch thermal-noise or flicker-noise analysis
  - no PVT or Monte Carlo sign-off
