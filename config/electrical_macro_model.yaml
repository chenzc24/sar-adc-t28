stage: topology_aware_electrical_macro_model

source_spec:
  resolution_bits: 10
  differential_full_scale_v: 1.8
  vdd_v: 0.9
  vcm_v: 0.45
  sampling_time_ns: 40.0
  conversion_time_budget_ns: 60.0
  bit_cycle_ns: 5.0
  settling_abs_max_lsb: 0.25

split_cdac:
  architecture: 5_plus_5_attenuation_capacitor
  unit_capacitance_ff: 6.86047
  msb_active_weights: [16, 8, 4, 2, 1]
  lsb_active_weights: [16, 8, 4, 2, 1]
  lsb_dummy_units: 1.0
  bridge_units: 1.032258064516129
  ideal_comparator_side_units: 32.0
  top_plate_parasitic_ff: 0.0
  bridge_node_parasitic_ff: 0.0

sampling_switch:
  source_resistance_ohm: 5000.0
  closed_resistance_ohm: 1000.0
  open_resistance_ohm: 1.0e12
  control_vt1_v: 0.35
  control_vt2_v: 0.55

bottom_plate_switch:
  closed_resistance_ohm: 1000.0
  open_resistance_ohm: 1.0e12
  control_vt1_v: 0.35
  control_vt2_v: 0.55

reference_network:
  source_resistance_ohm: 100.0
  decoupling_capacitance_pf: 2.0

comparator_macro:
  input_gm_us: 60.0
  regeneration_gm_us: 100.0
  differential_node_capacitance_ff: 20.0
  reset_resistance_ohm: 10.0
  common_mode_resistance_ohm: 1.0e9
  kickback_capacitance_ff: 0.05
  systematic_offset_v: 0.0
  resolved_differential_v: 0.45

timing:
  simulation_start_ns: 0.0
  sample_rise_ns: 1.0
  sample_fall_ns: 41.0
  first_trial_ns: 41.0
  cdac_settle_ns: 3.0
  compare_window_ns: 1.5
  reset_guard_ns: 0.05
  pulse_width_ns: 0.2
  edge_time_ps: 20.0
  stop_ns: 92.0
  max_step_ps: 2.0

spectre_cases:
  nominal_codes: [64, 256, 511, 512, 768, 959]
  near_transition_fraction_lsb: 0.25
  stressed_case:
    name: slow_reference_and_switch
    code: 768
    reference_resistance_ohm: 500.0
    bottom_plate_resistance_ohm: 1800.0
  parasitic_case:
    name: assumed_topology_parasitics
    top_plate_parasitic_ff: 5.0
    bridge_node_parasitic_ff: 3.0
  kickback_stress_case:
    name: one_ff_direct_kickback
    code: 768
    kickback_capacitance_ff: 1.0
