version: 1
scope: B_native_sampling_nominal_short_sine
system_spec: config/design_spec.yaml
sources:
  - path: verification/integration/b_sine_main_w_results.json
    input_frequency_hz: 500000
    input_differential_peak_v: 0.8
  - path: verification/integration/b_hf_main_w_results.json
    input_frequency_hz: 4500000
    input_differential_peak_v: 0.802125844320371
resolution_bits: 8
differential_span_v: 1.8
sample_rate_hz: 10000000
width_multipliers: [1, 2, 3]
length_nm: 150
frames_per_native_run: 24
warmup_frames: 4
observed_frames: 20
nominal_sample: SAMPLE_50_percent_falling_edge
held_read_after_sample_ns: 0.6

equivalent_delay:
  role: characterize_not_zero_delay_accuracy_gate
  absolute_max_ns: null
  common_alignment_reference_hz: 500000
  one_delay_per_width_for_all_measured_frequencies: true
  per_frequency_fit_is_diagnostic_only: true
  broadband_constant_delay_proven: false
  jitter_budget_rms_ps: 20.0
  jitter_budget_status: unchanged_not_measured_by_these_deterministic_runs

gain:
  metric: abs_gain_minus_one_times_fullscale_peak_divided_by_LSB
  endpoint_error_abs_max_lsb: 0.25
  status: provisional_sampling_engineering_allocation_not_industry_rule
  gain_calibration_assumed: false
  endpoint_value_is_scaled_fit_not_endpoint_measurement: true

nonfundamental:
  metric: held_minus_DC_and_fundamental
  shared_system_distortion_rms_budget_lsb: 0.15
  independent_sampling_rms_allocation_lsb: null
  role: report_fraction_of_shared_reserve_not_full_budget_ownership
  pure_static_nonlinearity_proven: false

joint_voltage_screen:
  metric: held_minus_source_shifted_by_common_low_frequency_delay
  peak_abs_max_lsb: 0.25
  status: provisional_nominal_sampling_screen_reusing_existing_voltage_guard
  retain_gain_error: true
  retain_DC_error: true
  per_sample_time_warping_allowed: false
  physical_clock_or_data_calibration_implemented: false

original_raw_error:
  metric: held_minus_source_at_nominal_sample
  peak_abs_max_lsb: 0.25
  role: retain_historical_diagnostic_not_standalone_dynamic_accuracy_gate

qualification:
  no_new_simulation: true
  no_OA_change: true
  power_difference_measured: false
  full_ADC_qualified: false
  untested: [broadband_response, PVT, mismatch, transient_noise, full_code, FFT, power]
