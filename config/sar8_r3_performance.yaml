baseline: SAR8_JOIN_R3_RESTORE_100PS_EDGE_50PS
library: SAR_ADC_T28
dut: sar_adc8_join_r3
testbench: tb_sar_adc8_join_r3
corner: tt
supply_v: 0.9
temperature_c: 27
mismatch: false
transient_noise: false
sample_rate_hz: 10000000
simulator: Spectre_21.1_APS
workers: 4
threads_per_job: 4
maxstep_ps: 10
reltol: 1.0e-5
vabstol: 1.0e-8
iabstol: 1.0e-13
errpreset: conservative
static:
  method: whole_ADC_output_driven_transition_bisection
  transition_indices: [1, 255]
  parallel_ranges: [[1, 64], [65, 128], [129, 192], [193, 255]]
  warmup_frames_per_job: 4
  half_bracket_lsb: 0.25
  bisection_iterations: 6
  final_bracket_width_lsb: 0.0078125
  require_initial_brackets: true
  dnl_excluded_saturated_codes: [0, 255]
  inl_conventions: [nominal_LSB_raw, endpoint_corrected]
dynamic:
  method: continuous_coherent_sine
  warmup_frames: 4
  samples: 1024
  coherent_bin: 461
  frequency_hz: 4501953.125
  input_dbfs: -1
  input_common_mode_v: 0.45
  fft_window: rectangular
  exclude_DC: true
  retain_harmonics_in_SNDR: true
  primary_ENOB: (measured_SNDR_dB-1.76)/6.02
monitor:
  compare_count_per_frame: 8
  early_code_check_ns: 90
  final_code_check_ns: 98
  output_rail_tolerance_fraction: 0.1
  internal_write_update_pulses_observed: false
output:
  raw_and_generated: output/sar8_r3_performance
  status: output/sar8_r3_performance/flow_status.json
  final_summary: output/sar8_r3_performance/summary.json
  final_report: output/sar8_r3_performance/report.md
