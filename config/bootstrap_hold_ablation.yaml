stage: bootstrap_held_error_ablation

conditions:
  supply_v: 0.90
  temperature_c: 27
  common_mode_v: 0.45
  single_input_v: [0.05, 0.45, 0.85]
  differential_input_v: [-0.80, -0.40, 0.0, 0.40, 0.80]
  nominal_load_f: 2.195e-13
  nominal_gate_fall_s: 1.0e-10
  sensitivity_endpoint_input_v: [0.05, 0.85]
  load_sweep_f: [1.0975e-13, 2.195e-13, 4.390e-13]
  isolated_gate_fall_s: [1.0e-10, 5.0e-10, 2.0e-9]

timing:
  input_step_s: 2.05e-7
  sample_start_s: 2.11e-7
  sample_end_s: 2.50e-7
  hold_measure_s: 2.70e-7
  stop_s: 3.20e-7
  clock_period_s: 1.0e-7

source:
  resistance_ohm: 50.0

targets:
  maximum_acquisition_error_v: 4.39e-4
  maximum_held_error_v: 4.39e-4

scope_limits:
  - TT 0.9-V 27-C diagnostic only
  - ideal relative gate drive is an ablation fixture, not a realizable clock circuit
  - single-ended capacitors to ground approximate one CDAC side and omit the full capacitance matrix
  - no mismatch, noise, extracted parasitics, PVT, power, or reliability sign-off
