stage: ideal_bootstrap_main_switch_pvt_screening

model_sections:
  SS: SSMacro_MOS_MOSCAP
  TT: TTMacro_MOS_MOSCAP
  FF: FFMacro_MOS_MOSCAP

conditions:
  process: [SS, TT, FF]
  supply_v: [0.81, 0.90, 0.99]
  temperature_c: [-40, 27, 125]
  signal_margin_v: 0.001
  signal_common_mode_step_v: 0.01
  differential_probe_v: 0.001

families:
  core:
    master: tsmcN28/nch_mac
    body_mode: ground
    finger_width_um: 0.25
    source_netlist: output/bootstrap_main_switch_screening/netlist/tb_bootstrap_core_main_char/input.scs
  deep_nwell:
    master: tsmcN28/nch_dnw_mac
    netlisted_model: nch_mac
    body_mode: signal_low
    finger_width_um: 0.25
    source_netlist: output/bootstrap_main_switch_screening/netlist/tb_bootstrap_dnw_main_char/input.scs
  nominal_1v8:
    master: tsmcN28/nch_18_mac
    body_mode: ground
    finger_width_um: 0.32
    source_netlist: output/bootstrap_main_switch_screening/netlist/tb_bootstrap_18_main_char/input.scs

candidates:
  - {name: core_l30_w0p5, family: core, length_nm: 30, multiplier: 2}
  - {name: core_l30_w0p75, family: core, length_nm: 30, multiplier: 3}
  - {name: core_l30_w1, family: core, length_nm: 30, multiplier: 4}
  - {name: core_l30_w2, family: core, length_nm: 30, multiplier: 8}
  - {name: core_l40_w1, family: core, length_nm: 40, multiplier: 4}
  - {name: core_l40_w1p5, family: core, length_nm: 40, multiplier: 6}
  - {name: core_l60_w2, family: core, length_nm: 60, multiplier: 8}
  - {name: dnw_l30_w0p5, family: deep_nwell, length_nm: 30, multiplier: 2}
  - {name: dnw_l30_w0p75, family: deep_nwell, length_nm: 30, multiplier: 3}
  - {name: dnw_l30_w1, family: deep_nwell, length_nm: 30, multiplier: 4}
  - {name: dnw_l30_w2, family: deep_nwell, length_nm: 30, multiplier: 8}
  - {name: dnw_l40_w1, family: deep_nwell, length_nm: 40, multiplier: 4}
  - {name: dnw_l40_w1p5, family: deep_nwell, length_nm: 40, multiplier: 6}
  - {name: dnw_l60_w2, family: deep_nwell, length_nm: 60, multiplier: 8}
  - {name: n18_l150_w2p56, family: nominal_1v8, length_nm: 150, multiplier: 8}
  - {name: n18_l150_w5p12, family: nominal_1v8, length_nm: 150, multiplier: 16}
  - {name: n18_l150_w8p96, family: nominal_1v8, length_nm: 150, multiplier: 28}
  - {name: n18_l150_w10p24, family: nominal_1v8, length_nm: 150, multiplier: 32}

targets:
  maximum_on_resistance_ohm: 1000.0
  effective_top_plate_capacitance_f: 2.195e-13
  hold_intervals_s: [5.0e-9, 5.0e-8]
  quarter_lsb_v: 4.39e-4

scope_limits:
  - ideal boosted gate equals signal common mode plus VDD
  - no finite bootstrap capacitor or driver loss
  - no charge injection, clock feedthrough, or transient acquisition
  - terminal voltages are reported without unpublished reliability sign-off limits
  - no Monte Carlo, layout parasitics, or production cell
