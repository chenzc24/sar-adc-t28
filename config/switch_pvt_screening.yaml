stage: transmission_gate_switch_pvt_screening

model_sections:
  SS: SSMacro_MOS_MOSCAP
  TT: TTMacro_MOS_MOSCAP
  FF: FFMacro_MOS_MOSCAP

conditions:
  process: [SS, TT, FF]
  supply_v: [0.81, 0.90, 0.99]
  temperature_c: [-40, 27, 125]
  signal_margin_v: 0.001
  signal_common_mode_step_v: 0.01
  differential_probe_v: 0.001

devices:
  finger_width_um: 0.25
  families:
    standard:
      nmos: tsmcN28/nch_mac
      pmos: tsmcN28/pch_mac
      source_netlist: output/switch_characterization/netlist/tb_tg_switch_char/input.scs
    high_vt:
      nmos: tsmcN28/nch_hvt_mac
      pmos: tsmcN28/pch_hvt_mac
      source_netlist: output/switch_pvt_screening/netlist/tb_tg_switch_hvt_char/input.scs

candidates:
  - {name: std_l30_w2, family: standard, length_nm: 30, nmos_multiplier: 8, pmos_multiplier: 8}
  - {name: std_l30_w3, family: standard, length_nm: 30, nmos_multiplier: 12, pmos_multiplier: 12}
  - {name: std_l30_w4, family: standard, length_nm: 30, nmos_multiplier: 16, pmos_multiplier: 16}
  - {name: std_l40_w4, family: standard, length_nm: 40, nmos_multiplier: 16, pmos_multiplier: 16}
  - {name: std_l60_w6, family: standard, length_nm: 60, nmos_multiplier: 24, pmos_multiplier: 24}
  - {name: hvt_l30_w4, family: high_vt, length_nm: 30, nmos_multiplier: 16, pmos_multiplier: 16}
  - {name: hvt_l30_w6, family: high_vt, length_nm: 30, nmos_multiplier: 24, pmos_multiplier: 24}
  - {name: hvt_l40_w6, family: high_vt, length_nm: 40, nmos_multiplier: 24, pmos_multiplier: 24}

targets:
  maximum_on_resistance_ohm: 1000.0
  effective_top_plate_capacitance_f: 2.195e-13
  hold_intervals_s: [5.0e-9, 5.0e-8]
  quarter_lsb_v: 4.39e-4

scope_limits:
  - pre-layout global PVT screening only
  - no Monte Carlo or local mismatch
  - no charge injection, clock feedthrough, or sampled-noise measurement
  - full-stress leakage is a screening bound, not a signed ADC error
