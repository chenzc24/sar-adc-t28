name: Project website

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/project-site.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site and check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The build reads the schematic and figures at a pinned commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python site/build.py
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v5
