 1462,830 1462,860 1510,860" fill="none" data-object-id="valid-wave" data-kind="construction-line" stroke="#0e776d" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polyline points="250,950 1232,950 1248,920 1510,920" fill="none" data-object-id="doutw" data-kind="construction-line" stroke="#17324d" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polyline points="250,920 1232,920 1248,950 1510,950" fill="none" data-object-id="doutw2" data-kind="construction-line" stroke="#17324d" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><text data-object-id="tt" data-kind="draft-text" x="30" y="20" text-anchor="start" font-size="25.6972" font-weight="bold" font-style="normal" fill="#17324d">SAR8 预期时序 · 一个 100 ns 转换周期</text><text data-object-id="ts" data-kind="draft-text" x="30" y="65" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#a65b12">示意波形来自现有相位命令；并非门级或晶体管仿真结果。</text><text data-object-id="tick0" data-kind="draft-text" x="240" y="120" text-anchor="start" font-size="12.8486" font-weight="normal" font-style="normal" fill="#17324d">0</text><text data-object-id="tick1" data-kind="draft-text" x="270" y="155" text-anchor="start" font-size="12.8486" font-weight="normal" font-style="normal" fill="#17324d">1</text><text data-object-id="tick40" data-kind="draft-text" x="720" y="120" text-anchor="start" font-size="12.8486" font-weight="normal" font-style="normal" fill="#17324d">40</text><text data-object-id="tick43" data-kind="draft-text" x="756" y="120" text-anchor="start" font-size="12.8486" font-weight="normal" font-style="normal" fill="#17324d">43</text><text data-object-id="tick50" data-kind="draft-text" x="840" y="120" text-anchor="start" font-size="12.8486" font-weight="normal" font-style="normal" fill="#17324d">50</text><text data-object-id="tick60" data-kind="draft-text" x="960" y="120" text-anchor="start" font-size="12.8486" font-weight="normal" font-style="normal" fill="#17324d">60</text><text data-object-id="tick70" data-kind="draft-text" x="1080" y="120" text-anchor="start" font-size="12.8486" font-weight="normal" font-style="normal" fill="#17324d">70</text><text data-object-id="tick80" data-kind="draft-text" x="1200" y="120" text-anchor="start" font-size="12.8486" font-weight="normal" font-style="normal" fill="#17324d">80</text><text data-object-id="tick82.5" data-kind="draft-text" x="1230" y="120" text-anchor="start" font-size="12.8486" font-weight="normal" font-style="normal" fill="#17324d">82.5</text><text data-object-id="tick90" data-kind="draft-text" x="1320" y="120" text-anchor="start" font-size="12.8486" font-weight="normal" font-style="normal" fill="#17324d">90</text><text data-object-id="tick100" data-kind="draft-text" x="1440" y="120" text-anchor="start" font-size="12.8486" font-weight="normal" font-style="normal" fill="#17324d">100</text><text data-object-id="unit" data-kind="draft-text" x="1530" y="120" text-anchor="start" font-size="13.6044" font-weight="normal" font-style="normal" fill="#17324d">ns</text><text data-object-id="sample-name" data-kind="draft-text" x="20" y="220" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#166c9a">SAMPLE / PHI</text><text data-object-id="vcm-name" data-kind="draft-text" x="20" y="310" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#0e776d">CDAC_VCM</text><text data-object-id="hold-name" data-kind="draft-text" x="20" y="400" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#166c9a">HOLD / ref ownership</text><text data-object-id="trial-name" data-kind="draft-text" x="20" y="490" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#a65b12">TRIAL (有效试探)</text><text data-object-id="cmp-name" data-kind="draft-text" x="20" y="580" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#7b4e9b">CMP_CLK (门控后)</text><text data-object-id="latch-name" data-kind="draft-text" x="20" y="670" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#7b4e9b">LATCH_G</text><text data-object-id="busy-name" data-kind="draft-text" x="20" y="760" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#166c9a">BUSY</text><text data-object-id="valid-name" data-kind="draft-text" x="20" y="850" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#0e776d">VALID (无 FAULT)</text><text data-object-id="doutn" data-kind="draft-text" x="20" y="940" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#17324d">DOUT[7:0]</text><text data-object-id="old-code" data-kind="draft-text" x="490" y="940" text-anchor="start" font-size="14.360199999999999" font-weight="normal" font-style="normal" fill="#17324d">上一拍：0x3C</text><text data-object-id="new-code" data-kind="draft-text" x="1282" y="940" text-anchor="start" font-size="14.360199999999999" font-weight="normal" font-style="normal" fill="#17324d">本拍：0xA5</text><text data-object-id="bit-0" data-kind="draft-text" x="779" y="450" text-anchor="start" font-size="13.6044" font-weight="normal" font-style="normal" fill="#a65b12">b7</text><text data-object-id="bit-1" data-kind="draft-text" x="839" y="450" text-anchor="start" font-size="13.6044" font-weight="normal" font-style="normal" fill="#a65b12">b6</text><text data-object-id="bit-2" data-kind="draft-text" x="899" y="450" text-anchor="start" font-size="13.6044" font-weight="normal" font-style="normal" fill="#a65b12">b5</text><text data-object-id="bit-3" data-kind="draft-text" x="959" y="450" text-anchor="start" font-size="13.6044" font-weight="normal" font-style="normal" fill="#a65b12">b4</text><text data-object-id="bit-4" data-kind="draft-text" x="1019" y="450" text-anchor="start" font-size="13.6044" font-weight="normal" font-style="normal" fill="#a65b12">b3</text><text data-object-id="bit-5" data-kind="draft-text" x="1079" y="450" text-anchor="start" font-size="13.6044" font-weight="normal" font-style="normal" fill="#a65b12">b2</text><text data-object-id="bit-6" data-kind="draft-text" x="1139" y="450" text-anchor="start" font-size="13.6044" font-weight="normal" font-style="normal" fill="#a65b12">b1</text><text data-object-id="bit-7" data-kind="draft-text" x="1199" y="450" text-anchor="start" font-size="13.6044" font-weight="normal" font-style="normal" fill="#a65b12">b0</text><text data-object-id="first" data-kind="draft-text" x="30" y="1060" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#17324d">首次：41 ns 关输入采样 → 42 ns 释放 VCM → 43 ns 加 MSB 试探 → 46 ns 比较 → 47.5 ns 锁存。</text><text data-object-id="bits" data-kind="draft-text" x="30" y="1110" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#17324d">逐位：3 ns 建立 + 1.5 ns 比较；每 5 ns 换一位，最后在 82.5 ns 发布。</text><text data-object-id="reset" data-kind="draft-text" x="30" y="1160" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#17324d">复位准备：90 ns 释放参考，约 90.22 ns 重接 VCM；101 ns 开始下一次输入采样。</text><text data-object-id="holdwarn" data-kind="draft-text" x="30" y="1210" text-anchor="start" font-size="14.360199999999999" font-weight="normal" font-style="normal" fill="#a65b12">比较脉冲命令在锁存后 30 ps 才结束；实际 setup/hold、门延迟与 PVT 必须单独核对。</text><text data-object-id="pulsewarn" data-kind="draft-text" x="30" y="1250" text-anchor="start" font-size="14.360199999999999" font-weight="normal" font-style="normal" fill="#17324d">窄试探/锁存脉冲为可视化示意。采样时清工作寄存器和 VALID，输出字保持到下一次完成。</text></g></g></svg>