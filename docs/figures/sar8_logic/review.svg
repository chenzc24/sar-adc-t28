-kind="draft-text" x="30" y="65" text-anchor="start" font-size="16.6276" font-weight="normal" font-style="normal" fill="#17324d">8 bit  /  10 MS/s  /  200 MHz bit clock  /  0.9 V</text><text data-object-id="status" data-kind="draft-text" x="30" y="100" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#a65b12">Canvas 方案：逻辑连接已展开；Virtuoso 实现、T28 延迟和 PVT 待验证。</text><text data-object-id="t-phase" data-kind="draft-text" x="50" y="200" text-anchor="start" font-size="17.383399999999998" font-weight="bold" font-style="normal" fill="#166c9a">外部相位输入</text><text data-object-id="l-phase0" data-kind="draft-text" x="50" y="243" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">SAMPLE / HOLD_START / PREPARE</text><text data-object-id="l-phase1" data-kind="draft-text" x="50" y="273" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">TRIAL / COMPARE / LATCH</text><text data-object-id="l-phase2" data-kind="draft-text" x="50" y="303" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">保持现有测试台的分离相位</text><text data-object-id="t-flags" data-kind="draft-text" x="470" y="200" text-anchor="start" font-size="17.383399999999998" font-weight="bold" font-style="normal" fill="#166c9a">SAR8_FLAGS</text><text data-object-id="l-flags0" data-kind="draft-text" x="470" y="243" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">HOLD / BUSY / TRIAL_EN</text><text data-object-id="l-flags1" data-kind="draft-text" x="470" y="273" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">VALID / FAULT / PUBLISH</text><text data-object-id="l-flags2" data-kind="draft-text" x="470" y="303" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">复位与比较器结果检查</text><text data-object-id="t-token" data-kind="draft-text" x="910" y="200" text-anchor="start" font-size="17.383399999999998" font-weight="bold" font-style="normal" fill="#166c9a">SAR8_TOKEN</text><text data-object-id="l-token0" data-kind="draft-text" x="910" y="243" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">T7 → T6 → … → T0</text><text data-object-id="l-token1" data-kind="draft-text" x="910" y="273" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">单热码选择当前比较位</text><text data-object-id="l-token2" data-kind="draft-text" x="910" y="303" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">在 LATCH_G 后推进</text><text data-object-id="t-work" data-kind="draft-text" x="910" y="490" text-anchor="start" font-size="17.383399999999998" font-weight="bold" font-style="normal" fill="#166c9a">SAR8_BIT × 8</text><text data-object-id="l-work0" data-kind="draft-text" x="910" y="533" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">每位：反馈 MUX + 工作 DFF</text><text data-object-id="l-work1" data-kind="draft-text" x="910" y="563" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">WORK OR 当前 TRIAL</text><text data-object-id="l-work2" data-kind="draft-text" x="910" y="593" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">末位结果直接进入 WNEXT</text><text data-object-id="t-bbm" data-kind="draft-text" x="1340" y="490" text-anchor="start" font-size="17.383399999999998" font-weight="bold" font-style="normal" fill="#166c9a">SAR8_BBM × 8 + dummy</text><text data-object-id="l-bbm0" data-kind="draft-text" x="1340" y="533" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">参考控制先断后接</text><text data-object-id="l-bbm1" data-kind="draft-text" x="1340" y="563" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">SEL0 / SEL1 / BASE</text><text data-object-id="l-bbm2" data-kind="draft-text" x="1340" y="593" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">100 ps 是目标，尚待表征</text><text data-object-id="t-comp" data-kind="draft-text" x="470" y="490" text-anchor="start" font-size="17.383399999999998" font-weight="bold" font-style="normal" fill="#166c9a">StrongARM 接口</text><text data-object-id="l-comp0" data-kind="draft-text" x="470" y="533" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">COMP_P / COMP_N → COMP</text><text data-object-id="l-comp1" data-kind="draft-text" x="470" y="563" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">READY = COMP_P XOR COMP_N</text><text data-object-id="l-comp2" data-kind="draft-text" x="470" y="593" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">未分出高低：FAULT，VALID=0</text><text data-object-id="t-output" data-kind="draft-text" x="910" y="800" text-anchor="start" font-size="17.383399999999998" font-weight="bold" font-style="normal" fill="#166c9a">独立输出寄存器 × 8</text><text data-object-id="l-output0" data-kind="draft-text" x="910" y="843" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">只在最后一位时整体发布</text><text data-object-id="l-output1" data-kind="draft-text" x="910" y="873" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">下一次采样与转换中保持 DOUT</text><text data-object-id="t-cg" data-kind="draft-text" x="50" y="490" text-anchor="start" font-size="17.383399999999998" font-weight="bold" font-style="normal" fill="#166c9a">SAR8_CLK_GATE × 2</text><text data-object-id="l-cg0" data-kind="draft-text" x="50" y="533" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">低电平 NAND 锁存器 + AND</text><text data-object-id="l-cg1" data-kind="draft-text" x="50" y="563" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">分别门控比较与判决时钟</text><text data-object-id="l-cg2" data-kind="draft-text" x="50" y="593" text-anchor="start" font-size="13.90672" font-weight="normal" font-style="normal" fill="#17324d">BUSY 下降不截断脉冲</text><text data-object-id="pub-note" data-kind="draft-text" x="565" y="800" text-anchor="start" font-size="13.6044" font-weight="normal" font-style="normal" fill="#0e776d">末位且 READY、无 FAULT</text><text data-object-id="review-help" data-kind="draft-text" x="30" y="1020" text-anchor="start" font-size="15.8718" font-weight="normal" font-style="normal" fill="#17324d">审核入口：SAR8_TOP 看完整连接；SAR8_BIT 看单 bit；SAR8_TOKEN / FLAGS / CLK_GATE / BBM 可继续展开。</text><text data-object-id="time-help" data-kind="draft-text" x="30" y="1070" text-anchor="start" font-size="15.8718" font-weight="normal" font-style="normal" fill="#17324d">预期时序见 SAR8_TIMING：41 ns 采样结束 → 42 ns VCM 释放 → 43 ns 试探 → 82.5 ns 结果发布。</text><text data-object-id="boundary" data-kind="draft-text" x="30" y="1120" text-anchor="start" font-size="14.360199999999999" font-weight="normal" font-style="normal" fill="#a65b12">参考相位采用现有接口；完整时钟发生器、CDAC 应力和 Bootstrap 冷角问题仍需各自验证。</text></g></g></svg>