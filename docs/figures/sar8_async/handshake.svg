<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5.2 -26 1560.4 1072" role="img" aria-labelledby="title" data-style-profile="razavi-textbook-v1"><title id="title">SAR8 Async Logic — Architecture Review</title><rect x="-5.2" y="-26" width="1560.4" height="1072" fill="#fff"/><style>@font-face{font-family:"ICM Round Period";src:url(data:font/ttf;base64,) format("truetype");font-weight:400;font-style:normal;font-display:block;unicode-range:U+002E}@font-face{font-family:"ICM Round Period";src:url(data:font/ttf;base64,) format("truetype");font-weight:400;font-style:italic;font-display:block;unicode-range:U+002E}@font-face{font-family:"ICM Round Period";src:url(data:font/ttf;base64,) format("truetype");font-weight:700;font-style:normal;font-display:block;unicode-range:U+002E}@font-face{font-family:"ICM Round Period";src:url(data:font/ttf;base64,) format("truetype");font-weight:700;font-style:italic;font-display:block;unicode-range:U+002E}svg{font-size:15.116px;fill:#000}text{font-family:'ICM Round Period','Metropolis','DejaVu Sans',Arial,'Helvetica Neue',Helvetica,sans-serif}</style><g data-layer="formal"><g data-layer="drafting" data-drafting-layer="background"><polygon data-object-id="reset-start" data-kind="draft-rectangle" points="0,130 450,130 450,320 0,320" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="trial" data-kind="draft-rectangle" points="550,130 1000,130 1000,320 550,320" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="eval" data-kind="draft-rectangle" points="1100,130 1550,130 1550,320 1100,320" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="cap" data-kind="draft-rectangle" points="1100,460 1550,460 1550,650 1100,650" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="rst" data-kind="draft-rectangle" points="550,460 1000,460 1000,650 550,650" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="advance" data-kind="draft-rectangle" points="0,460 450,460 450,650 0,650" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/></g><g data-layer="routes"/><g data-layer="junctions"/><g data-layer="symbols"/><g data-layer="annotations"/><g data-layer="drafting" data-drafting-layer="foreground"><text data-object-id="title" data-kind="draft-text" x="0" y="0" text-anchor="start" font-size="27.2088" font-weight="bold" font-style="normal" fill="#17324d">SAR8A | 单个位握手协议</text><text data-object-id="sub" data-kind="draft-text" x="0" y="48" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">首版保守分相：数据先锁存，比较器后复位，token 最后推进。状态图不是无冒险门级实现。</text><text data-object-id="reset-start-title" data-kind="draft-text" x="20" y="158" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">0 / START：初始化与复位确认</text><text data-object-id="reset-start-l0" data-kind="draft-text" x="20" y="194" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">CMP_CLK=0；清旧请求/完成状态</text><text data-object-id="reset-start-l1" data-kind="draft-text" x="20" y="222" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">P,N=11 且 reset guard 到期</text><text data-object-id="reset-start-l2" data-kind="draft-text" x="20" y="250" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">START 每帧只接受一次</text><text data-object-id="trial-title" data-kind="draft-text" x="570" y="158" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">1 / TRIAL：参考切换与建立</text><text data-object-id="trial-l0" data-kind="draft-text" x="570" y="194" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">TOKEN 固定，CODE=W OR TOKEN</text><text data-object-id="trial-l1" data-kind="draft-text" x="570" y="222" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">BBM + 驱动 + CDAC settling guard</text><text data-object-id="trial-l2" data-kind="draft-text" x="570" y="250" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">DAC_OK 与 RESET_OK 都满足</text><text data-object-id="eval-title" data-kind="draft-text" x="1120" y="158" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">2 / EVAL：等待本轮判决</text><text data-object-id="eval-l0" data-kind="draft-text" x="1120" y="194" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">CMP_CLK=1；armed=1</text><text data-object-id="eval-l1" data-kind="draft-text" x="1120" y="222" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">只接受新鲜、未消费的 10 / 01</text><text data-object-id="eval-l2" data-kind="draft-text" x="1120" y="250" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">DATA 与双轨有效性保持合格</text><text data-object-id="cap-title" data-kind="draft-text" x="1120" y="488" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">3 / CAPTURE：锁存当前位</text><text data-object-id="cap-l0" data-kind="draft-text" x="1120" y="524" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">post-valid guard → CAPTURE 脉冲</text><text data-object-id="cap-l1" data-kind="draft-text" x="1120" y="552" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">检查 DATA 稳定；token 不移动</text><text data-object-id="cap-l2" data-kind="draft-text" x="1120" y="580" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">CAPTURE 落沿 + 保持裕量 → CAP_DONE</text><text data-object-id="rst-title" data-kind="draft-text" x="570" y="488" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">4 / RESET：返回复位态</text><text data-object-id="rst-l0" data-kind="draft-text" x="570" y="524" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">CAP_DONE 后才 CMP_CLK=0</text><text data-object-id="rst-l1" data-kind="draft-text" x="570" y="552" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">忽略复位沿的 XOR 暂态</text><text data-object-id="rst-l2" data-kind="draft-text" x="570" y="580" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">P,N=11 + reset guard → RESET_OK</text><text data-object-id="advance-title" data-kind="draft-text" x="20" y="488" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">5 / ADVANCE：下一位 / 结束</text><text data-object-id="advance-l0" data-kind="draft-text" x="20" y="524" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">非末位：移位 → 下轮 TRIAL</text><text data-object-id="advance-l1" data-kind="draft-text" x="20" y="552" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">末位：清 token → PUBLISH</text><text data-object-id="advance-l2" data-kind="draft-text" x="20" y="580" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">DOUT 稳定后 VALID=1，BUSY=0</text><g data-object-id="a01" data-kind="draft-arrow"><polyline points="450,225 537.57267475,225" fill="none" stroke="#456e94" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="550,225 537.57267475,227.965116375 537.57267475,222.034883625" fill="#456e94"/></g><g data-object-id="a12" data-kind="draft-arrow"><polyline points="1000,225 1087.57267475,225" fill="none" stroke="#456e94" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="1100,225 1087.57267475,227.965116375 1087.57267475,222.034883625" fill="#456e94"/></g><g data-object-id="a23" data-kind="draft-arrow"><polyline points="1320,320 1320,447.57267475" fill="none" stroke="#456e94" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="1320,460 1317.034883625,447.57267475 1322.965116375,447.57267475" fill="#456e94"/></g><g data-object-id="a34" data-kind="draft-arrow"><polyline points="1100,555 1012.42732525,555" fill="none" stroke="#456e94" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="1000,555 1012.42732525,552.034883625 1012.42732525,557.965116375" fill="#456e94"/></g><g data-object-id="a45" data-kind="draft-arrow"><polyline points="550,555 462.42732525,555" fill="none" stroke="#456e94" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="450,555 462.42732525,552.034883625 462.42732525,557.965116375" fill="#456e94"/></g><g data-object-id="loop" data-kind="draft-arrow"><polyline points="220,460 220,390 770,390 770,332.42732525" fill="none" stroke="#456e94" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="770,320 772.965116375,332.42732525 767.034883625,332.42732525" fill="#456e94"/></g><text data-object-id="looplabel" data-kind="draft-text" x="270" y="375" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#486a88">只有 ADVANCE 使 token 前进</text><text data-object-id="eqtitle" data-kind="draft-text" x="0" y="735" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">组合解码仅分类电平；不把原始 XOR 直接当时钟</text><text data-object-id="eq0" data-kind="draft-text" x="0" y="785" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">RESET_PAIR = P AND N        RAILS_VALID = P XOR N</text><text data-object-id="eq1" data-kind="draft-text" x="0" y="825" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">DATA = P AND NOT N          ILLEGAL = NOT (P OR N)</text><text data-object-id="eq2" data-kind="draft-text" x="0" y="875" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">11：复位 / 未决      10：正判决      01：负判决      00：非法，不捕获</text><text data-object-id="eq3" data-kind="draft-text" x="0" y="930" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">DEC_VALID 还需 armed + 本轮复位已确认 + 未消费 + 输出稳定资格。</text><text data-object-id="fault" data-kind="draft-text" x="0" y="1000" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#9a5b1e">任何相位：RESET / ABORT / 截止优先；停本地事件，CMP_CLK=0，不发布失败结果。</text><text data-object-id="fault2" data-kind="draft-text" x="0" y="1040" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">迟到延时脉冲不得污染新帧；复位、电平阈值、setup/hold、pulse width 均需 T28/PVT 验证。</text></g></g></svg>