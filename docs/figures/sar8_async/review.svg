<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5.2 -25.33333396911621 1630.4 1091.3333339691162" role="img" aria-labelledby="title" data-style-profile="razavi-textbook-v1"><title id="title">SAR8 Async Logic — Architecture Review</title><rect x="-5.2" y="-25.33333396911621" width="1630.4" height="1091.3333339691162" fill="#fff"/><style>@font-face{font-family:"ICM Round Period";src:url(data:font/ttf;base64,) format("truetype");font-weight:400;font-style:normal;font-display:block;unicode-range:U+002E}@font-face{font-family:"ICM Round Period";src:url(data:font/ttf;base64,) format("truetype");font-weight:400;font-style:italic;font-display:block;unicode-range:U+002E}@font-face{font-family:"ICM Round Period";src:url(data:font/ttf;base64,) format("truetype");font-weight:700;font-style:normal;font-display:block;unicode-range:U+002E}@font-face{font-family:"ICM Round Period";src:url(data:font/ttf;base64,) format("truetype");font-weight:700;font-style:italic;font-display:block;unicode-range:U+002E}svg{font-size:15.116px;fill:#000}text{font-family:'ICM Round Period','Metropolis','DejaVu Sans',Arial,'Helvetica Neue',Helvetica,sans-serif}</style><g data-layer="formal"><g data-layer="drafting" data-drafting-layer="background"><polygon data-object-id="frame" data-kind="draft-rectangle" points="0,110 400,110 400,300 0,300" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="seq" data-kind="draft-rectangle" points="510,110 990,110 990,300 510,300" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="status" data-kind="draft-rectangle" points="1100,110 1540,110 1540,300 1100,300" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="bit" data-kind="draft-rectangle" points="0,420 400,420 400,610 0,610" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="dac" data-kind="draft-rectangle" points="510,420 990,420 990,610 510,610" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="cmp" data-kind="draft-rectangle" points="1100,420 1540,420 1540,610 1100,610" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="out" data-kind="draft-rectangle" points="0,730 400,730 400,920 0,920" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="token" data-kind="draft-rectangle" points="510,730 990,730 990,920 510,920" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="if" data-kind="draft-rectangle" points="1100,730 1540,730 1540,920 1100,920" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/></g><g data-layer="routes"/><g data-layer="junctions"/><g data-layer="symbols"/><g data-layer="annotations"/><g data-layer="drafting" data-drafting-layer="foreground"><text data-object-id="title" data-kind="draft-text" x="0" y="0" text-anchor="start" font-size="27.2088" font-weight="bold" font-style="normal" fill="#17324d">SAR8A | 异步 SAR 控制架构</text><text data-object-id="sub" data-kind="draft-text" x="0" y="45" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">8 bit · 10 MS/s · flat CDAC | 架构提案，不是已实现/仿真通过的门级电路</text><text data-object-id="frame-title" data-kind="draft-text" x="20" y="138" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar8a_frame | 外部帧接口</text><text data-object-id="frame-l0" data-kind="draft-text" x="20" y="174" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">采样 1–41 ns；START 43 ns</text><text data-object-id="frame-l1" data-kind="draft-text" x="20" y="202" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">独立截止 88 ns；PREPARE 90 ns</text><text data-object-id="frame-l2" data-kind="draft-text" x="20" y="230" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">START / ABORT / HOLD</text><text data-object-id="seq-title" data-kind="draft-text" x="530" y="138" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar8a_seq | 异步相位控制</text><text data-object-id="seq-l0" data-kind="draft-text" x="530" y="174" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">DAC_OK → EVAL → DEC_VALID</text><text data-object-id="seq-l1" data-kind="draft-text" x="530" y="202" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">CAPTURE → RESET_OK → ADVANCE</text><text data-object-id="seq-l2" data-kind="draft-text" x="530" y="230" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">无固定 200 MHz 位时钟</text><text data-object-id="status-title" data-kind="draft-text" x="1120" y="138" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar8a_status | 发布 / 故障</text><text data-object-id="status-l0" data-kind="draft-text" x="1120" y="174" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">末位完成 → PUBLISH → VALID</text><text data-object-id="status-l1" data-kind="draft-text" x="1120" y="202" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">超时中止，禁止发布，保留旧字</text><text data-object-id="status-l2" data-kind="draft-text" x="1120" y="230" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">截止优先；迟到事件不得重入</text><text data-object-id="bit-title" data-kind="draft-text" x="20" y="448" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar8a_bit ×8 | 工作寄存器</text><text data-object-id="bit-l0" data-kind="draft-text" x="20" y="484" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">TOKEN[i] 选中，CAPTURE 锁存</text><text data-object-id="bit-l1" data-kind="draft-text" x="20" y="512" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">CODE[i] = W[i] OR TOKEN[i]</text><text data-object-id="bit-l2" data-kind="draft-text" x="20" y="540" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">CAPTURE 期间 token 不变</text><text data-object-id="dac-title" data-kind="draft-text" x="530" y="448" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar8a_bbm + delay | 参考路径</text><text data-object-id="dac-l0" data-kind="draft-text" x="530" y="484" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">HOLD / CODE → SEL0 / SEL1</text><text data-object-id="dac-l1" data-kind="draft-text" x="530" y="512" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">先关后开，再等待 CDAC 建立</text><text data-object-id="dac-l2" data-kind="draft-text" x="530" y="540" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">DAC_OK 由待表征的保护延时产生</text><text data-object-id="cmp-title" data-kind="draft-text" x="1120" y="448" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar_strongarm_t28 | 原比较器</text><text data-object-id="cmp-l0" data-kind="draft-text" x="1120" y="484" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">CMP_CLK=1 评估；=0 预充</text><text data-object-id="cmp-l1" data-kind="draft-text" x="1120" y="512" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">P,N=11 复位；10 / 01 判决</text><text data-object-id="cmp-l2" data-kind="draft-text" x="1120" y="540" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">不改核心；新增接收负载需复验</text><text data-object-id="out-title" data-kind="draft-text" x="20" y="758" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar8a_out8 | 独立输出字</text><text data-object-id="out-l0" data-kind="draft-text" x="20" y="794" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">PUBLISH 时装入完整 WORK</text><text data-object-id="out-l1" data-kind="draft-text" x="20" y="822" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">VALID 晚于 DOUT 最慢稳定</text><text data-object-id="out-l2" data-kind="draft-text" x="20" y="850" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">采样 / 超时均保留旧 DOUT</text><text data-object-id="token-title" data-kind="draft-text" x="530" y="758" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar8a_token8 | 一热位置</text><text data-object-id="token-l0" data-kind="draft-text" x="530" y="794" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">T7 → T6 → … → T0</text><text data-object-id="token-l1" data-kind="draft-text" x="530" y="822" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">仅由 ADVANCE 移位</text><text data-object-id="token-l2" data-kind="draft-text" x="530" y="850" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">锁存结束 + 复位确认后推进</text><text data-object-id="if-title" data-kind="draft-text" x="1120" y="758" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar8a_cmp_if | 完成 / 复位握手</text><text data-object-id="if-l0" data-kind="draft-text" x="1120" y="794" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">接收 P/N，armed / consumed</text><text data-object-id="if-l1" data-kind="draft-text" x="1120" y="822" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">一次 EVAL 只接收一次完成</text><text data-object-id="if-l2" data-kind="draft-text" x="1120" y="850" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">RESET_OK 还需最小复位时间</text><g data-object-id="a-frame" data-kind="draft-arrow"><polyline points="400,190 497.57267475,190" fill="none" stroke="#456e94" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="510,190 497.57267475,192.965116375 497.57267475,187.034883625" fill="#456e94"/></g><g data-object-id="a-stat" data-kind="draft-arrow"><polyline points="990,190 1087.57267475,190" fill="none" stroke="#456e94" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="1100,190 1087.57267475,192.965116375 1087.57267475,187.034883625" fill="#456e94"/></g><g data-object-id="a-code" data-kind="draft-arrow"><polyline points="400,510 497.57267475,510" fill="none" stroke="#456e94" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="510,510 497.57267475,512.965116375 497.57267475,507.034883625" fill="#456e94"/></g><g data-object-id="a-dac" data-kind="draft-arrow"><polyline points="990,510 1087.57267475,510" fill="none" stroke="#456e94" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="1100,510 1087.57267475,512.965116375 1087.57267475,507.034883625" fill="#456e94"/></g><g data-object-id="a-rails" data-kind="draft-arrow"><polyline points="1320,610 1320,717.57267475" fill="none" stroke="#456e94" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="1320,730 1317.034883625,717.57267475 1322.965116375,717.57267475" fill="#456e94"/></g><g data-object-id="a-ready" data-kind="draft-arrow"><polyline points="1540,825 1620,825 1620,350 1030,350 1030,255 1002.42732525,255" fill="none" stroke="#456e94" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="990,255 1002.42732525,252.034883625 1002.42732525,257.965116375" fill="#456e94"/></g><g data-object-id="a-token" data-kind="draft-arrow"><polyline points="510,825 450,825 450,655 330,655 330,622.42732525" fill="none" stroke="#456e94" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="330,610 332.965116375,622.42732525 327.034883625,622.42732525" fill="#456e94"/></g><g data-object-id="a-work" data-kind="draft-arrow"><polyline points="180,610 180,717.57267475" fill="none" stroke="#456e94" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="180,730 177.034883625,717.57267475 182.965116375,717.57267475" fill="#456e94"/></g><text data-object-id="work" data-kind="draft-text" x="195" y="677" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#486a88">WORK[7:0]</text><text data-object-id="return" data-kind="draft-text" x="1100" y="345" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#486a88">DATA / DEC_VALID / RESET_OK</text><text data-object-id="control" data-kind="draft-text" x="0" y="980" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">内部顺序：TRIAL → DAC guard → EVAL → fresh VALID → CAPTURE → RESET → ADVANCE</text><text data-object-id="note1" data-kind="draft-text" x="0" y="1025" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">保留外部 10 MHz 采样；移除外部 CLK_TRIAL / CLK_COMPARE / CLK_LATCH。</text><text data-object-id="note2" data-kind="draft-text" x="0" y="1060" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#9a5b1e">箭头为功能关系，不是电气连线；每个模块的门级实现、延时与 PVT 验证均待审核后展开。</text><g data-object-id="a-cmpclk" data-kind="draft-arrow"><polyline points="870,300 870,375 1200,375 1200,407.57267475" fill="none" stroke="#456e94" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="1200,420 1197.034883625,407.57267475 1202.965116375,407.57267475" fill="#456e94"/></g><text data-object-id="cmpclk-label" data-kind="draft-text" x="880" y="403" text-anchor="start" font-size="15.116" font-weight="normal" font-style="normal" fill="#486a88">CMP_CLK</text></g></g></svg>