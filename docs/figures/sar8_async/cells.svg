<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5.2 -25.33333396911621 1520.4 1161.3333759307861" role="img" aria-labelledby="title" data-style-profile="razavi-textbook-v1"><title id="title">SAR8 Async Logic — Architecture Review</title><rect x="-5.2" y="-25.33333396911621" width="1520.4" height="1161.3333759307861" fill="#fff"/><style>@font-face{font-family:"ICM Round Period";src:url(data:font/ttf;base64,) format("truetype");font-weight:400;font-style:normal;font-display:block;unicode-range:U+002E}@font-face{font-family:"ICM Round Period";src:url(data:font/ttf;base64,) format("truetype");font-weight:400;font-style:italic;font-display:block;unicode-range:U+002E}@font-face{font-family:"ICM Round Period";src:url(data:font/ttf;base64,) format("truetype");font-weight:700;font-style:normal;font-display:block;unicode-range:U+002E}@font-face{font-family:"ICM Round Period";src:url(data:font/ttf;base64,) format("truetype");font-weight:700;font-style:italic;font-display:block;unicode-range:U+002E}svg{font-size:15.116px;fill:#000}text{font-family:'ICM Round Period','Metropolis','DejaVu Sans',Arial,'Helvetica Neue',Helvetica,sans-serif}</style><g data-layer="formal"><g data-layer="drafting" data-drafting-layer="background"><polygon data-object-id="top" data-kind="draft-rectangle" points="0,115.5 470,115.5 470,290.5 0,290.5" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="control" data-kind="draft-rectangle" points="570,115.5 1510,115.5 1510,290.5 570,290.5" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="frame" data-kind="draft-rectangle" points="0,370.5 470,370.5 470,525.5 0,525.5" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="seq" data-kind="draft-rectangle" points="520,370.5 990,370.5 990,525.5 520,525.5" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="if" data-kind="draft-rectangle" points="1040,370.5 1510,370.5 1510,525.5 1040,525.5" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="token" data-kind="draft-rectangle" points="0,585.5 470,585.5 470,740.5 0,740.5" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="bit" data-kind="draft-rectangle" points="520,585.5 990,585.5 990,740.5 520,740.5" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="out" data-kind="draft-rectangle" points="1040,585.5 1510,585.5 1510,740.5 1040,740.5" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="delay" data-kind="draft-rectangle" points="0,800.5 470,800.5 470,955.5 0,955.5" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="bbm" data-kind="draft-rectangle" points="520,800.5 990,800.5 990,955.5 520,955.5" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/><polygon data-object-id="status" data-kind="draft-rectangle" points="1040,800.5 1510,800.5 1510,955.5 1040,955.5" fill="none" stroke="#486a88" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"/></g><g data-layer="routes"/><g data-layer="junctions"/><g data-layer="symbols"/><g data-layer="annotations"/><g data-layer="drafting" data-drafting-layer="foreground"><text data-object-id="title" data-kind="draft-text" x="0" y="0" text-anchor="start" font-size="27.2088" font-weight="bold" font-style="normal" fill="#17324d">SAR8A | 模块与目标 cell 划分</text><text data-object-id="sub" data-kind="draft-text" x="0" y="48" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">计划接口，尚未创建这些 OA masters。各 cell 显式带 VDD / VSS；系统 RST_N 低有效。</text><text data-object-id="top-title" data-kind="draft-text" x="20" y="143" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar_logic_8b_async | 计划顶层</text><text data-object-id="top-l0" data-kind="draft-text" x="20" y="179" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">帧输入 + comparator P/N</text><text data-object-id="top-l1" data-kind="draft-text" x="20" y="207" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">DOUT / reference controls / status</text><text data-object-id="control-title" data-kind="draft-text" x="590" y="143" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">控制层：frame + seq + cmp_if + status</text><text data-object-id="control-l0" data-kind="draft-text" x="590" y="179" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">START / ABORT / HOLD；DAC_OK / DEC_VALID / CAP_DONE / RESET_OK</text><text data-object-id="control-l1" data-kind="draft-text" x="590" y="207" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">EVAL_REQ / CAPTURE / ADVANCE / PUBLISH 分离，消费一次后再回零</text><g data-object-id="hier" data-kind="draft-arrow"><polyline points="470,200 557.57267475,200" fill="none" stroke="#456e94" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/><polygon points="570,200 557.57267475,202.965116375 557.57267475,197.034883625" fill="#456e94"/></g><text data-object-id="frame-title" data-kind="draft-text" x="20" y="398" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar8a_frame ×1</text><text data-object-id="frame-l0" data-kind="draft-text" x="20" y="434" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">外部帧 → START / ABORT / HOLD</text><text data-object-id="frame-l1" data-kind="draft-text" x="20" y="462" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">截止相位独立，不依赖转换进展</text><text data-object-id="seq-title" data-kind="draft-text" x="540" y="398" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar8a_seq ×1</text><text data-object-id="seq-l0" data-kind="draft-text" x="540" y="434" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">握手相位状态，互斥 / 复位优先</text><text data-object-id="seq-l1" data-kind="draft-text" x="540" y="462" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">不以纯组合 XOR 实现反馈振荡</text><text data-object-id="if-title" data-kind="draft-text" x="1060" y="398" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar8a_cmp_if ×1</text><text data-object-id="if-l0" data-kind="draft-text" x="1060" y="434" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">接收双轨，armed / consumed</text><text data-object-id="if-l1" data-kind="draft-text" x="1060" y="462" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">DATA / DEC_VALID / RESET_OK / BAD</text><text data-object-id="token-title" data-kind="draft-text" x="20" y="613" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar8a_token8 ×1</text><text data-object-id="token-l0" data-kind="draft-text" x="20" y="649" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">START 装入 T7；ADVANCE 移位</text><text data-object-id="token-l1" data-kind="draft-text" x="20" y="677" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">当前 CAPTURE 全程保持 token</text><text data-object-id="bit-title" data-kind="draft-text" x="540" y="613" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar8a_bit ×8</text><text data-object-id="bit-l0" data-kind="draft-text" x="540" y="649" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">TOKEN + DATA + CAPTURE → W</text><text data-object-id="bit-l1" data-kind="draft-text" x="540" y="677" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">CODE = W OR TOKEN</text><text data-object-id="out-title" data-kind="draft-text" x="1060" y="613" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar8a_out8 ×1</text><text data-object-id="out-l0" data-kind="draft-text" x="1060" y="649" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">PUBLISH 装载 WORK[7:0]</text><text data-object-id="out-l1" data-kind="draft-text" x="1060" y="677" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">正常采样 / 故障保留 DOUT</text><text data-object-id="delay-title" data-kind="draft-text" x="20" y="828" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar8a_delay ×多组</text><text data-object-id="delay-l0" data-kind="draft-text" x="20" y="864" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">DAC / valid / capture / reset / publish</text><text data-object-id="delay-l1" data-kind="draft-text" x="20" y="892" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">各自实例与 tap，快慢角都需验</text><text data-object-id="bbm-title" data-kind="draft-text" x="540" y="828" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar8a_bbm ×8 + dummy</text><text data-object-id="bbm-l0" data-kind="draft-text" x="540" y="864" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">即刻关断、延迟导通</text><text data-object-id="bbm-l1" data-kind="draft-text" x="540" y="892" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">SEL0 与 SEL1 不得同时有效</text><text data-object-id="status-title" data-kind="draft-text" x="1060" y="828" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">sar8a_status ×1</text><text data-object-id="status-l0" data-kind="draft-text" x="1060" y="864" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">BUSY / VALID / FAULT</text><text data-object-id="status-l1" data-kind="draft-text" x="1060" y="892" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">末位发布与截止冲突：截止优先</text><text data-object-id="prims" data-kind="draft-text" x="0" y="1030" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#17324d">基础 cell：INV / NAND / NOR / AND / OR / XOR / BUF / MUX2 / reset-priority SR / resettable DFF。</text><text data-object-id="c-element" data-kind="draft-text" x="0" y="1070" text-anchor="start" font-size="18.895" font-weight="normal" font-style="normal" fill="#17324d">C-element 若采用，单列 cell 表征；先不采用动态 TSPC。旧同步 FLAGS / CLK_GATE 需替换。</text><text data-object-id="order" data-kind="draft-text" x="0" y="1130" text-anchor="start" font-size="18.895" font-weight="bold" font-style="normal" fill="#9a5b1e">审核顺序：cmp_if → delay / BBM → seq → bit / token → out / status → top</text></g></g></svg>